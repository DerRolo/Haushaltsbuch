name: Web-Version für den PC

# Läuft erst, wenn der Android-Build fertig ist (egal ob erfolgreich oder fehlgeschlagen,
# nur nicht abgebrochen), damit beide nie gleichzeitig laufen. Von Hand startbar bleibt es auch.
on:
  workflow_run:
    workflows: ["Android-App bauen"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Falls GitHub das Artefakt nicht findet (kommt gelegentlich vor): kurz warten, neu hochladen, noch einmal veröffentlichen
      - name: Kurz warten
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Artefakt erneut hochladen
        if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v4
        with:
          path: www
        continue-on-error: true
      - id: deployment2
        name: Erneut veröffentlichen
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
