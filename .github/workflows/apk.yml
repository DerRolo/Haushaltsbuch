name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Icon einsetzen
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          import os

          source = Image.open("www/icon-512.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)

              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          print("Android-App-Icons erfolgreich erstellt.")
          PY

      - name: Web-App ins Projekt kopieren
        run: npx cap sync android

      - name: Gleichen Signaturschlüssel für jedes Update verwenden
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Haushaltsbuch.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Haushaltsbuch 1.${{ github.run_number }}
          files: Haushaltsbuch.apk
