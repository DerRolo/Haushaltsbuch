name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Icon einsetzen
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          import os

          source = Image.open("www/icon-512.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = source.resize((size, size), Image.Resampling.LANCZOS)

              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          print("Android-App-Icons erfolgreich erstellt.")
          PY

      - name: Build-Info schreiben (für Versionsanzeige und Update-Suche in der App)
        run: |
          CODE=$(( $(date +%s) / 60 ))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          printf '{"repo":"%s","code":%s,"name":"1.%s","built":"%s"}' "${{ github.repository }}" "$CODE" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/app-info.json
          cat www/app-info.json

      - name: Web-App ins Projekt kopieren
        run: npx cap sync android

      - name: Immer denselben Signaturschlüssel verwenden
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "FEHLER: Das Secret KEYSTORE_B64 fehlt (Settings > Secrets and variables > Actions)."
            echo "Ohne festen Schlüssel lässt sich die App nicht über die alte installieren."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "Fingerabdruck des Signaturschlüssels (muss bei jedem Build gleich sein):"
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint\|SHA" || true

      - name: Versionsnummer setzen
        run: |
          # versionCode = Minuten seit 1970: wächst immer, auch wenn der Zähler der Workflow-Läufe einmal neu beginnt
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Updater-Plugin einbauen (lädt Updates selbst und startet die Installation)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package' "$MAIN" | sed 's/package \(.*\);/\1/')
          echo "Paket: $PKG, Ordner: $DIR"
          cp "$MAIN" "$MAIN.orig"
          cat > "$DIR/UpdaterPlugin.java" <<JAVA
          package $PKG;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "Updater")
          public class UpdaterPlugin extends Plugin {
            @PluginMethod
            public void canInstall(PluginCall call) {
              JSObject o = new JSObject();
              boolean ok = Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls();
              o.put("ok", ok);
              call.resolve(o);
            }

            @PluginMethod
            public void openSettings(PluginCall call) {
              Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }

            @PluginMethod
            public void install(final PluginCall call) {
              final String url = call.getString("url");
              new Thread(new Runnable() {
                public void run() {
                  try {
                    File f = new File(getContext().getCacheDir(), "update.apk");
                    if (f.exists()) f.delete();
                    HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                    c.setInstanceFollowRedirects(true);
                    c.setConnectTimeout(20000);
                    c.setReadTimeout(30000);
                    int code = c.getResponseCode();
                    if (code >= 300) throw new Exception("Download-Fehler " + code);
                    long total = c.getContentLengthLong();
                    InputStream in = c.getInputStream();
                    FileOutputStream out = new FileOutputStream(f);
                    byte[] buf = new byte[65536];
                    long done = 0;
                    int last = -1;
                    int n;
                    while ((n = in.read(buf)) > 0) {
                      out.write(buf, 0, n);
                      done += n;
                      if (total > 0) {
                        int pct = (int) (done * 100 / total);
                        if (pct != last) {
                          last = pct;
                          JSObject p = new JSObject();
                          p.put("pct", pct);
                          notifyListeners("progress", p);
                        }
                      }
                    }
                    out.close();
                    in.close();
                    Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                    Intent i = new Intent(Intent.ACTION_VIEW);
                    i.setDataAndType(uri, "application/vnd.android.package-archive");
                    i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                    getContext().startActivity(i);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject(String.valueOf(e.getMessage()));
                  }
                }
              }).start();
            }
          }
          JAVA
          cat > "$MAIN" <<JAVA
          package $PKG;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(UpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          # Erlaubnis zum Installieren und Dateifreigabe für den Cache-Ordner
          MF=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$MF"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-path name="my_images" path="." />
            <cache-path name="my_cache_images" path="." />
            <files-path name="my_files" path="." />
          </paths>
          XML
          grep -n "fileprovider\|REQUEST_INSTALL" "$MF" || true

      - name: APK bauen (mit Updater)
        id: build1
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Falls der Updater nicht baut, ohne ihn bauen (Schutznetz)
        if: steps.build1.outcome == 'failure'
        working-directory: android
        run: |
          echo "WARNUNG: Der Updater ließ sich nicht bauen. Baue ohne ihn, die App lädt Updates dann über den Browser."
          MAIN=$(find app/src/main/java -name MainActivity.java | head -1)
          mv "$MAIN.orig" "$MAIN"
          rm -f "$(dirname "$MAIN")/UpdaterPlugin.java"
          ./gradlew assembleDebug --no-daemon

      - name: APK mit dem festen Schlüssel signieren
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          # Gradle hat die APK evtl. mit einem frischen Zufallsschlüssel signiert. Wir signieren sie deshalb
          # immer selbst mit dem Schlüssel aus dem Secret neu. So bleibt die Signatur bei jedem Build gleich.
          $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out Haushaltsbuch_v1.${{ github.run_number }}.apk android/app/build/outputs/apk/debug/app-debug.apk

      - name: Signatur der APK prüfen und notieren
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --verbose Haushaltsbuch_v1.${{ github.run_number }}.apk | head -5
          FP=$($APKSIGNER verify --print-certs Haushaltsbuch_v1.${{ github.run_number }}.apk | grep -i "certificate SHA-256" | head -1 | sed 's/.*: //')
          KFP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signatur-Fingerabdruck der APK: $FP"
          echo "Fingerabdruck des Schlüssels:  $KFP"
          if [ "$FP" != "$KFP" ]; then echo "FEHLER: Die APK ist nicht mit dem festen Schlüssel signiert."; exit 1; fi
          echo "Version 1.${{ github.run_number }}. Build-Code: $CODE. Signatur (SHA-256): $FP. Der Signatur-Wert muss in JEDEM Release gleich sein, sonst lässt sich die App nicht aktualisieren." > release-notes.txt

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Haushaltsbuch 1.${{ github.run_number }}
          files: Haushaltsbuch_v1.${{ github.run_number }}.apk
          body_path: release-notes.txt
          make_latest: true
