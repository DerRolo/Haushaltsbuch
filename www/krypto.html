I18N.add({"Jede Transaktion (Kauf, Verkauf, Tausch, Transfer, Reward, Gebuehr) ist mit Zeitpunkt, Mengen, Euro-Wert und Wallet gespeichert. Bei Tauschgeschaeften und Rewards entspricht der Euro-Wert dem Marktwert zum Zeitpunkt der Transaktion. Geschaetzte Werte sind in Abschnitt 7 aufgefuehrt.": "Every transaction (buy, sell, swap, transfer, reward, fee) is stored with time, amounts, euro value and wallet. For swaps and rewards the euro value equals the market value at the time of the transaction. Estimated values are listed in section 7.", "Verbrauchsfolge: Beim Verkauf oder Tausch gelten die zuerst angeschafften Einheiten als zuerst veraeussert (FIFO). Die Reihenfolge wird je Wallet bzw. Boerse betrachtet, entsprechend der Einzelbetrachtung nach dem BMF-Schreiben vom 6. Maerz 2025 (nach unserem Verstaendnis; im Einzelfall bitte pruefen).": "Order of consumption: when selling or swapping, the units acquired first are treated as disposed of first (FIFO). The order is considered per wallet or exchange, in line with the single-view approach of the BMF letter of 6 March 2025 (to our understanding; please check in individual cases).", "Transfers zwischen eigenen Wallets sind keine Veraeusserung. Anschaffungsdatum und Anschaffungskosten gehen mit den Einheiten mit. Ein Tausch von Coin gegen Coin gilt als Veraeusserung des hingegebenen Coins; als Erloes wird der Marktwert der erhaltenen Einheiten in Euro zum Zeitpunkt des Tauschs angesetzt.": "Transfers between your own wallets are not a disposal. Acquisition date and acquisition cost move with the units. A swap of coin for coin counts as a disposal of the coin given up; the proceeds are the market value in euros of the units received at the time of the swap.", "Haltefrist: Veraeusserungen nach mehr als einem Jahr seit Anschaffung werden als steuerfrei ausgewiesen (private Veraeusserungsgeschaefte, Paragraph 23 EStG). Fuer Einheiten, die fuers Staking eingesetzt wurden, wird die Frist nicht verlaengert. Fuer Waehrungs- und Zahlungs-Token entspricht das der Auffassung der Finanzverwaltung; bei anderen Token-Arten ist die Lage nicht abschliessend geklaert.": "Holding period: disposals more than one year after acquisition are shown as tax-free (private disposal transactions, section 23 EStG). For units used for staking the period is not extended. For currency and payment tokens this matches the view of the tax authorities; for other token types the position is not conclusively settled.", "Gebuehren: Gebuehren beim Kauf erhoehen die Anschaffungskosten, Gebuehren beim Verkauf mindern den Erloes. Gebuehren, die in Coins bezahlt wurden (z. B. BNB), werden zusaetzlich als kleine Veraeusserung dieses Coins erfasst.": "Fees: fees on purchases increase the acquisition cost, fees on sales reduce the proceeds. Fees paid in coins (e.g. BNB) are additionally recorded as a small disposal of that coin.", "Rewards und Staking: Der Wert beim Erhalt wird als sonstige Einkuenfte (Paragraph 22 Nr. 3 EStG) ausgewiesen und ist zugleich Anschaffungskosten der erhaltenen Einheiten. Bei passivem Staking gilt der Zufluss nach dem BMF-Schreiben spaetestens zum Jahresende als erfolgt.": "Rewards and staking: the value when received is shown as other income (section 22 no. 3 EStG) and is also the acquisition cost of the units received. For passive staking the inflow is deemed received at the latest at year end under the BMF letter.", "Verluste durch Hack oder Totalverlust sind keine Veraeusserung und werden getrennt ausgewiesen; sie sind in den obigen Gewinnen nicht verrechnet.": "Losses from a hack or total loss are not a disposal and are shown separately; they are not netted in the gains above.", "Krypto-Steuerbericht {}": "Crypto tax report {}", "Erstellt am {} mit dem Krypto-Buch. Berechnungsmethode: {}, {}. Datenbasis: {} Buchungen in {} Wallets und Boersen.": "Created on {} with the Crypto Ledger. Calculation method: {}, {}. Data basis: {} transactions in {} wallets and exchanges.", "1. Zusammenfassung {}": "1. Summary {}", "3. Veraeusserungen {} ({})": "3. Disposals {} ({})", "4. Rewards und Staking {} ({})": "4. Rewards and staking {} ({})", "5. Gebuehren {}": "5. Fees {}", "6. Bestaende zum 31.12.{}": "6. Holdings on 31 Dec {}", "Posten": "Item", "Betrag": "Amount", "Gewinn/Verlust aus Veraeusserungen bis 1 Jahr Haltedauer (steuerpflichtig)": "Gain/loss from disposals within 1 year holding period (taxable)", "Gewinn/Verlust aus Veraeusserungen nach mehr als 1 Jahr (steuerfrei)": "Gain/loss from disposals after more than 1 year (tax-free)", "Rewards und Staking (Wert beim Erhalt)": "Rewards and staking (value when received)", "Verluste durch Hack oder Totalverlust (Anschaffungskosten, getrennt ausgewiesen)": "Losses from hack or total loss (acquisition cost, shown separately)", "Datum": "Date", "Menge": "Amount", "Erworben": "Acquired", "Kosten": "Cost", "Gewinn/Verlust": "Gain/loss", "Frist": "Period", "pflichtig": "taxable", "frei": "tax-free", "Wert beim Erhalt": "Value when received", "Anschaffungskosten": "Acquisition cost", "Darunter.": "Below the limit.", "{} Gebuehren-Eintraege, zusammen {}.": "{} fee entries, total {}.", "Buchungen mit geschaetztem oder fehlendem Euro-Wert in {}: {}. Abgaenge ohne bekannten Einkauf: {} (hier wurde vorsichtig mit Anschaffungskosten von 0 EUR gerechnet, die Zeilen sind mit ? markiert). Automatisch ergaenzte Transfers: {}.": "Transactions with estimated or missing euro value in {}: {}. Disposals without known purchase: {} (conservatively calculated with an acquisition cost of EUR 0 here; the rows are marked with ?). Automatically added transfers: {}.", "Export CSV {}": "Export CSV {}", "Steuerbericht {} (PDF)": "Tax report {} (PDF)", "Marktwert in € fehlt (nötig für die Steuer)": "Market value in € missing (needed for tax)", "Kursverlauf {}": "Price history {}"});

const num=s=>{s=String(s==null?'':s).trim().replace(/\s/g,'').replace('€','');if(!s)return NaN;if(LOC()==='en-US')s=s.replace(/,/g,'');else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN};

let S={wallets:[],tx:[],cfg:{meth:'FIFO',scope:'wallet',heal:false,hv:2,price:{}}};
const K='krypto-v1',KB=window.KBX||null;let db=null,own=0,ready=true,LAST={},GS=null,CFGD=null,ORD=null;const got={};

function docsOf(){const by={},D={'config/main':{wallets:S.wallets,cfg:S.cfg,rec:S.rec||[]}};for(const t of S.tx){const y=t.d.slice(0,4);(by[y]=by[y]||[]).push(t)}
  for(const y in by)D['orders/'+y]={e:sortD(by[y])};for(const p in LAST)if(p.startsWith('orders/')&&!(p in D))D[p]={e:[]};return D}

  if(!ready)return;const D=docsOf();own++;try{for(const p in D){const j=JSON.stringify(D[p]);if(LAST[p]!==j){LAST[p]=j;db.doc(p).set(D[p])}}}finally{own--}}

  if(!CFGD.exists&&!ORD.docs.length){ready=true;if(S.tx.length||S.wallets.length)save();render();return}
  const c=CFGD.exists?CFGD.data():{};S.wallets=c.wallets||[];S.rec=c.rec||[];S.cfg=Object.assign({meth:'FIFO',scope:'wallet',heal:false,hv:2,price:{}},c.cfg||{});if(!S.cfg.price)S.cfg.price={};migCfg();
  S.tx=[];ORD.docs.forEach(d=>{const x=d.data();if(x&&x.e)S.tx.push(...x.e)});
  LAST={};const D=docsOf();for(const p in D)LAST[p]=JSON.stringify(D[p]);ORD.docs.forEach(d=>{if(!(('orders/'+d.id) in D))LAST['orders/'+d.id]=JSON.stringify({e:[]})});
  ready=true;if(!E&&!W)render();setTimeout(()=>runRec(),500)}
function onStatus(x){const ok=x.state==='ok'||x.state==='busy',e=$('#sync');if(e){e.className='sync'+(ok?'':' wait');e.querySelector('span').textContent=x.msg||''}GS=x;const g=$('#ghstate');if(g)g.textContent=x.msg||''}

    db.doc('config/main').onSnapshot(d=>{if(own)return;CFGD=d;got.c=1;apply()});
    db.collection('orders').onSnapshot(c2=>{if(own)return;ORD=c2;got.o=1;apply()});db.startSync()}

/* ---------- Beteiligung (Claus) ---------- */
function share(t){const c=t.cl;if(!c)return 1;const m=(t.t==='verkauf'||t.t==='verlust')?t.as:t.bs;
  if(c.m==='pct')return Math.min(1,(c.v||0)/100);

/* ---------- Steuer-Engine: walletbezogen, FIFO oder LIFO ---------- */
const addY=d=>(+d.slice(0,4)+1)+d.slice(4,10);
function calc(meth,list){
  const lots=new Map(),R={disp:[],inc:[],loss:[],fees:[],open:[],miss:[],auto:[],eurW:{},cash:[0,0]};
  const key=(w,c)=>(S.cfg.scope==='all'?'*':w)+'|'+c;
  const add=(w,c,d,s,uc,o,i)=>{if(!(s>0)||!c||c==='€')return;const k=key(w,c);if(!lots.has(k))lots.set(k,[]);lots.get(k).push({d,s,uc,o,i});sortD(lots.get(k))};
  const take=(w,c,s,t)=>{const a=lots.get(key(w,c))||[],out=[];let r=s;
    while(r>1e-12){const l=meth==='LIFO'?a[a.length-1]:a[0];if(!l)break;const u=Math.min(l.s,r);out.push({d:l.d,s:u,cost:u*l.uc,uc:l.uc,o:l.o,i:l.i});l.s-=u;r-=u;if(l.s<=1e-12)meth==='LIFO'?a.pop():a.shift()}
    if(r>1e-9&&S.cfg.heal&&S.cfg.scope!=='all'){const own=key(w,c),L=a2=>meth==='LIFO'?a2[a2.length-1]:a2[0];

function gapScan(){const sc=S.cfg.scope,hl=S.cfg.heal;S.cfg.scope='wallet';S.cfg.heal=false;const R=calc(S.cfg.meth);S.cfg.scope=sc;S.cfg.heal=hl;return R}
function sugList(){const R=gapScan(),EV=new Map(),add=(w,c,t,q)=>{if(!w||!c||c==='€'||!(q)||!isFinite(q))return;const k=w+'|'+c;if(!EV.has(k))EV.set(k,[]);EV.get(k).push({d:t.d,q,t})};
  for(const t of S.tx){const w=t.w;
    if(t.t==='kauf')add(w,t.b,t,t.bs);else if(t.t==='verkauf')add(w,t.a,t,-t.as);else if(t.t==='tausch'){add(w,t.a,t,-t.as);add(w,t.b,t,t.bs)}
    else if(t.t==='transfer'){add(w,t.a,t,-t.as);add(t.w2,t.a,t,t.as)}else if(t.t==='reward'||t.t==='bestand')add(w,t.b,t,t.bs);else if(t.t==='verlust')add(w,t.a,t,-t.as);
    if(t.fc&&t.fs&&t.t!=='transfer')add(w,t.fc,t,-t.fs)}
  EV.forEach(a=>a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0));
  const bal=(w,c,d)=>{let s=0;for(const e of EV.get(w+'|'+c)||[]){if(e.d>d)break;s+=e.q}return s};
  const okW=w=>{const o=S.wallets.find(x=>x.id===w);return o&&o.st!=='archiv'&&!BAD.includes(o.st)};
  const tol=s=>Math.max(s*.02,1e-8),near=(a,b)=>Math.abs(Date.parse(a+'Z')-Date.parse(b+'Z'))<=7*864e5;
  const no=new Set(S.cfg.nosug||[]),out=[],outs=S.tx.filter(t=>t.t==='verlust'&&t.tag==='Ausgleich'&&okW(t.w)),ins=S.tx.filter(t=>t.t==='bestand'&&t.tag==='Ausgleich'&&okW(t.w)),usedO=new Set();

  for(const i of ins)for(const o of outs){if(usedO.has(o.i)||o.w===i.w||o.a!==i.b||Math.abs(o.as-i.bs)>tol(i.bs)||!near(o.d,i.d))continue;const k='P|'+i.i+'|'+o.i;if(no.has(k))continue;usedO.add(o.i);out.push({k,kind:'P',c:i.b,s:i.bs,y:i.w,x:o.w,din:i.d,dout:o.d,inTx:i,outTx:o});break}

  return out.slice(0,40)}
function fillAll(){const ids=[],ws=new Set();ids.ws=ws;let n=0;for(let pass=0;pass<5;pass++){const R=gapScan(),M=R.miss.filter(x=>{const o=S.wallets.find(y=>y.id===x.w);return o&&!BAD.includes(o.st)&&afterCut(x.w,x.d)});if(!M.length)break;
  M.forEach(x=>{ws.add(x.w);const i=uid()+n++;ids.push(i);S.tx.push({i,t:'bestand',d:new Date(Date.parse(x.d+'Z')-60000).toISOString().slice(0,19),w:x.w,b:x.c,bs:x.s,eur:0,tag:'Ausgleich',note:'Zubuchung (Bestand fehlte, Einkaufswert unbekannt)'})})}
