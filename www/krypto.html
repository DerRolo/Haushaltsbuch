<div id="app"><header class="top"><div><h1>Krypto</h1><div class="sum" id="hsum"></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="sync" id="sync"><i></i><span>lokal gespeichert</span></div><a class="btn sm ghost" href="index.html" style="text-decoration:none">‹ Haushalt</a></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main></div><div id="toast"></div>
<script src="ghk.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.round(n*100)/100)+' €';
const qty=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:8}).format(n);
const num=s=>{s=String(s==null?'':s).trim().replace(/\s/g,'').replace('€','');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN};
const ns=n=>(n==null||isNaN(n))?'':String(n).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TYPES={kauf:'Kauf',verkauf:'Verkauf',tausch:'Tausch',transfer:'Transfer',gebuehr:'Gebühr (Coin-Abzug, Gas)',reward:'Reward / Staking',bestand:'Bestand / Korrektur-Zugang',verlust:'Verlust (Hack, tot)',ein:'Einzahlung €',aus:'Auszahlung €'};
const WST={aktiv:'Aktiv',archiv:'Archiviert',tot:'Tot',gehackt:'Gehackt',infiltriert:'Infiltriert'};
const BAD=['tot','gehackt','infiltriert'];
const CM={eur:'Nach Euro-Einsatz (mein € von Gesamt)',pct:'Feste Prozent',coin:'Feste Coin-Menge',nur:'Nur für Claus',offen:'Anteil offen (klären)'};
const F={kauf:'as,b,bs,w',verkauf:'a,as,bs,w',tausch:'a,as,b,bs,eur,w',transfer:'a,as,w,w2',gebuehr:'w',reward:'b,bs,eur,w',bestand:'b,bs,eur,w',verlust:'a,as,w',ein:'as,w',aus:'as,w'};
let S={wallets:[],tx:[],cfg:{meth:'FIFO',scope:'wallet',heal:true,price:{}}};
const K='krypto-v1',KB=window.KBX||null;let db=null,own=0,ready=true,LAST={},GS=null,CFGD=null,ORD=null;const got={};
function loadLocal(){try{const j=localStorage.getItem(K);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
function docsOf(){const by={},D={'config/main':{wallets:S.wallets,cfg:S.cfg}};for(const t of S.tx){const y=t.d.slice(0,4);(by[y]=by[y]||[]).push(t)}
  for(const y in by)D['orders/'+y]={e:sortD(by[y])};for(const p in LAST)if(p.startsWith('orders/')&&!(p in D))D[p]={e:[]};return D}
function save(){if(!db){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}return}
  if(!ready)return;const D=docsOf();own++;try{for(const p in D){const j=JSON.stringify(D[p]);if(LAST[p]!==j){LAST[p]=j;db.doc(p).set(D[p])}}}finally{own--}}
function apply(){if(!got.c||!got.o)return;
  if(!CFGD.exists&&!ORD.docs.length){ready=true;if(S.tx.length||S.wallets.length)save();render();return}
  const c=CFGD.exists?CFGD.data():{};S.wallets=c.wallets||[];S.cfg=Object.assign({meth:'FIFO',scope:'wallet',heal:true,price:{}},c.cfg||{});if(!S.cfg.price)S.cfg.price={};
  S.tx=[];ORD.docs.forEach(d=>{const x=d.data();if(x&&x.e)S.tx.push(...x.e)});
  LAST={};const D=docsOf();for(const p in D)LAST[p]=JSON.stringify(D[p]);ORD.docs.forEach(d=>{if(!(('orders/'+d.id) in D))LAST['orders/'+d.id]=JSON.stringify({e:[]})});
  ready=true;if(!E&&!W)render()}
function onStatus(x){const ok=x.state==='ok'||x.state==='busy',e=$('#sync');if(e){e.className='sync'+(ok?'':' wait');e.querySelector('span').textContent=x.msg||''}GS=x;const g=$('#ghstate');if(g)g.textContent=x.msg||''}
function start(){loadLocal();const c=KB&&KB.ghLoad();
  if(c){ready=false;db=KB.ghMake(c,onStatus);
    db.doc('config/main').onSnapshot(d=>{if(own)return;CFGD=d;got.c=1;apply()});
    db.collection('orders').onSnapshot(c2=>{if(own)return;ORD=c2;got.o=1;apply()});db.startSync()}
  render()}
function saveF(n,t){if(KB)KB.saveFile(n,t,toast);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}}
const sortD=a=>a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
/* ---------- Beteiligung (Claus) ---------- */
function share(t){const c=t.cl;if(!c)return 1;const m=(t.t==='verkauf'||t.t==='verlust')?t.as:t.bs;
  if(c.m==='pct')return Math.min(1,(c.v||0)/100);
  if(c.m==='eur')return t.eur>0?Math.min(1,(c.v||0)/t.eur):0;
  if(c.m==='coin')return m>0?Math.min(1,(c.v||0)/m):0;
  return 0}
/* ---------- Steuer-Engine: walletbezogen, FIFO oder LIFO ---------- */
const addY=d=>(+d.slice(0,4)+1)+d.slice(4,10);
function calc(meth){
  const lots=new Map(),R={disp:[],inc:[],loss:[],fees:[],open:[],miss:[],auto:[],cash:[0,0]};
  const key=(w,c)=>(S.cfg.scope==='all'?'*':w)+'|'+c;
  const add=(w,c,d,s,uc)=>{if(!(s>0)||!c||c==='€')return;const k=key(w,c);if(!lots.has(k))lots.set(k,[]);lots.get(k).push({d,s,uc});sortD(lots.get(k))};
  const take=(w,c,s,t)=>{const a=lots.get(key(w,c))||[],out=[];let r=s;
    while(r>1e-12){const l=meth==='LIFO'?a[a.length-1]:a[0];if(!l)break;const u=Math.min(l.s,r);out.push({d:l.d,s:u,cost:u*l.uc,uc:l.uc});l.s-=u;r-=u;if(l.s<=1e-12)meth==='LIFO'?a.pop():a.shift()}
    if(r>1e-9&&S.cfg.heal&&S.cfg.scope!=='all'){const own=key(w,c),L=a2=>meth==='LIFO'?a2[a2.length-1]:a2[0];
      const srcs=[...lots.entries()].filter(([k,a2])=>k!==own&&k.endsWith('|'+c)&&a2.length&&!BAD.includes((S.wallets.find(x=>x.id===k.slice(0,-c.length-1))||{}).st)).sort((x,y)=>meth==='LIFO'?(L(y[1]).d<L(x[1]).d?-1:1):(L(x[1]).d<L(y[1]).d?-1:1));
      for(const [k,a2] of srcs){while(r>1e-12&&a2.length){const l=L(a2),u=Math.min(l.s,r);out.push({d:l.d,s:u,cost:u*l.uc,uc:l.uc});R.auto.push({d:t.d,c,s:u,from:k.slice(0,-c.length-1),to:w,i:t.i});l.s-=u;r-=u;if(l.s<=1e-12)meth==='LIFO'?a2.pop():a2.shift()}if(r<=1e-12)break}}
    if(r>1e-9){R.miss.push({i:t.i,d:t.d,c,s:r,w});out.push({d:t.d,s:r,cost:0,uc:0,miss:1})}return out};
  const sell=(t,w,c,s,pr,ty)=>{for(const p of take(w,c,s,t)){const x=pr*p.s/s;R.disp.push({i:t.i,d:t.d,c,s:p.s,acq:p.d,pr:x,cost:p.cost,g:x-p.cost,tax:!!p.miss||t.d.slice(0,10)<=addY(p.d),ty,miss:!!p.miss})}};
  const fe0=(t,f)=>(t.fe||0)*f;
  const fee=(t,f,w)=>{const fe=(t.fe||0)*f,fs=(t.fs||0)*f;if(!(fe>0)&&!(fs>0))return 0;R.fees.push({d:t.d,eur:fe,c:t.fc,s:fs,i:t.i});if(t.fc&&t.fc!=='€'&&fs>0)sell(t,w,t.fc,fs,fe,'gebuehr');return fe};
  for(const t of sortD([...S.tx])){const f=share(t);if(t.cl&&t.cl.m==='offen')R.open.push(t);if(f<=0)continue;
    const as=(t.as||0)*f,bs=(t.bs||0)*f,ev=(t.eur||0)*f,w=t.w||'?';
    if(t.t==='ein'){R.cash[0]+=as;fee(t,f,w)}
    else if(t.t==='aus'){R.cash[1]+=as;fee(t,f,w)}
    else if(t.t==='gebuehr')fee(t,f,w);
    else if(t.t==='bestand')add(w,t.b,t.d,bs,ev/bs);
    else if(t.t==='kauf'){const fe=fe0(t,f);add(w,t.b,t.d,bs,(ev+fe)/bs);fee(t,f,w)}
    else if(t.t==='verkauf'){const fe=fe0(t,f);sell(t,w,t.a,as,ev-fe,'verkauf');fee(t,f,w)}
    else if(t.t==='tausch'){const fe=fe0(t,f);sell(t,w,t.a,as,ev-fe,'tausch');add(w,t.b,t.d,bs,ev/bs);fee(t,f,w)}
    else if(t.t==='transfer'){for(const p of take(w,t.a,as,t))add(t.w2||'?',t.a,p.d,p.s,p.uc);fee(t,f,w)}
    else if(t.t==='reward'){add(w,t.b,t.d,bs,ev/bs);R.inc.push({d:t.d,c:t.b,s:bs,eur:ev,i:t.i});fee(t,f,w)}

  const tx=D.filter(x=>x.tax),fr=D.filter(x=>!x.tax),lim=+y>=2023?1000:600,gs=sum(tx),inc=R.inc.filter(x=>x.d.startsWith(y)),fe=R.fees.filter(x=>x.d.startsWith(y)).reduce((a,x)=>a+x.eur,0),ls=R.loss.filter(x=>x.d.startsWith(y));

  <div class="card"><h3>Private Veräußerungsgeschäfte ${y}</h3><div class="grp">Haltefrist bis 1 Jahr (steuerpflichtig)</div><div class="big ${gs>=0?'pos':'neg'}">${eur(gs)}</div><div class="small muted">Grenze pro Jahr: ${eur(lim)} (bis 2023: 600 €). ${gs<lim?'Darunter.':'<b>Überschritten.</b>'}</div><div class="grp">Über 1 Jahr gehalten (steuerfrei)</div><div class="num">${eur(sum(fr))}</div></div>
  <div class="card"><h3>Weitere Zahlen ${y}</h3><div class="kv" style="padding:0;border:0"><span>Rewards / Staking (Wert beim Erhalt)</span><span class="num">${eur(inc.reduce((a,x)=>a+x.eur,0))}</span></div><div class="kv" style="padding:0;border:0"><span>Gebühren gesamt</span><span class="num">${eur(fe)}</span></div><div class="kv" style="padding:0;border:0"><span>Verluste Hack / tot (Anschaffungskosten)</span><span class="num">${eur(ls.reduce((a,x)=>a+x.cost,0))}</span></div><div class="hint">Hack- und Totverluste fließen nicht in die Gewinne ein. Mit Steuerberater klären.</div></div>`;
  const ES=S.tx.filter(x=>x.d.startsWith(y)&&(x.est||x.fest)&&act(x.w));if(ES.length)h+=`<div class="banner"><b>${ES.length} Buchung(en) mit geschätztem oder fehlendem EUR-Wert</b><span class="small">Prüfen: ${ES.filter(x=>x.est===2||x.fest===2).length} ohne Wert, Rest aus Kursen der Importdatei geschätzt.</span></div>`;
  const AU=R.auto.filter(x=>x.d.startsWith(y)&&act(x.from)&&act(x.to));if(AU.length)h+=`<div class="banner"><b>${AU.length} fehlende Transfers automatisch ergänzt</b><span class="small">Bestand wurde aus einem anderen Wallet übernommen, als hättest du ihn dorthin geschickt. Bitte bei Gelegenheit als echte Transfers eintragen.</span><details><summary class="small">Liste</summary><div class="small">${AU.slice(0,60).map(x=>x.d.slice(0,10)+' · '+qty(x.s)+' '+esc(x.c)+' · '+esc(wname(x.from))+' → '+esc(wname(x.to))).join('<br>')}</div></details></div>`;
  if(D.some(x=>x.miss&&act((S.tx.find(t=>t.i===x.i)||{}).w)))h+=`<div class="banner"><b>Bestand fehlt</b><span class="small">Bei diesen Abgängen fehlt der Einkauf in den Daten (Altbestand). Sie sind vorsichtig als steuerpflichtig mit Kosten 0 gerechnet. Auf deinen heutigen Bestand hat das keinen Einfluss.</span><details><summary class="small">Liste (${R.miss.length})</summary><div class="small">${R.miss.filter(x=>x.d.startsWith(y)&&act(x.w)).slice(0,60).map(x=>x.d.slice(0,10)+' · '+qty(x.s)+' '+esc(x.c)+' · '+esc(wname(x.w))).join('<br>')}</div></details></div>`;
  h+=`<div class="card flat"><div class="tbl"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th align="left">Datum</th><th align="left">Coin</th><th align="right">Menge</th><th align="right">Erlös</th><th align="right">Kosten</th><th align="right">G/V</th></tr>${D.map(x=>`<tr style="border-top:1px solid var(--line)"><td>${x.d.slice(0,10)}</td><td>${esc(x.c)}${x.miss?' ?':''}${x.tax?'':' ✓'}</td><td align="right">${qty(x.s)}</td><td align="right">${eur(x.pr)}</td><td align="right">${eur(x.cost)}</td><td align="right" class="${x.g>=0?'pos':'neg'}">${eur(x.g)}</td></tr>`).join('')}</table></div></div><div class="small muted">✓ = über 1 Jahr gehalten. Stand ist keine Steuerberatung.</div><div class="btns"><button class="btn" data-act="csv">CSV ${y} exportieren</button></div>`;return h};
const meth=()=>`<div class="card"><h3>Verbrauchsfolge</h3><div class="seg">${['FIFO','LIFO'].map(m=>`<button class="${S.cfg.meth===m?'on':''}" data-act="meth" data-v="${m}">${m}</button>`).join('')}</div><div class="small muted">FIFO (zuerst gekauft, zuerst verkauft) ist der Standard und die Vorgabe des BMF.</div><div class="seg">${[['wallet','Je Wallet'],['all','Gesamt (wie bisherige Excel)']].map(([k,l])=>`<button class="${(S.cfg.scope||'wallet')===k?'on':''}" data-act="scope" data-v="${k}">${l}</button>`).join('')}</div><div class="seg"><button class="${S.cfg.heal?'on':''}" data-act="heal" data-v="1">Lücken automatisch füllen</button><button class="${S.cfg.heal?'':'on'}" data-act="heal" data-v="0">Aus</button></div><div class="small muted">Je Wallet: Transfers nehmen das Anschaffungsdatum mit (BMF-Linie). Gesamt: ein Topf je Coin, Wallet-Status zählt dann nicht.</div></div>`;
let IM=null;
const ghCard=()=>{if(!KB)return'';if(db){const c=KB.ghLoad();return`<div class="card"><h3>Verbindung</h3><div class="small muted">Deine Daten liegen auf diesem Gerät und im privaten Repository <b>${esc(c.owner)}/${esc(c.repo)}</b>.</div><div class="small" id="ghstate">${esc((GS||{}).msg||'')}</div><div class="btns"><button class="btn" data-act="ghSync">Jetzt synchronisieren</button><button class="btn" data-act="ghCode">Kopplungscode</button><button class="btn dng" data-act="ghOut">Trennen</button></div><div id="ghcode"></div></div>`}
  return`<div class="card"><h3>Mit GitHub verbinden</h3><div class="small muted">Eigenes privates Repository nur für Krypto. Ist es leer, werden deine lokalen Daten hochgeladen, sonst gilt der Stand im Repository.</div><div class="field"><label for="gh-code">Kopplungscode (wenn schon ein Gerät verbunden ist)</label><input id="gh-code" placeholder="KB1.…" autocapitalize="none"></div><div class="field"><label for="gh-o">GitHub-Benutzername</label><input id="gh-o" autocapitalize="none" autocomplete="off"></div><div class="field"><label for="gh-r">Repository</label><input id="gh-r" value="krypto-daten" autocapitalize="none" autocomplete="off"></div><div class="field"><label for="gh-t">Zugangs-Token</label><input id="gh-t" type="password" autocapitalize="none" autocomplete="off" placeholder="github_pat_…"></div><div id="gh-err" class="small neg"></div><div class="btns"><button class="btn pri" data-act="ghGo">Verbinden</button></div></div>`};
V.mehr=()=>{let h=ghCard()+`<div class="card"><h3>Binance-Import</h3><div class="small muted">Spot Trade History als CSV (mit Gebühren). Bereits importierte Orders werden erkannt und übersprungen.</div>`;
  if(!IM)h+=`<div class="btns"><label class="btn pri">CSV wählen<input type="file" accept=".csv" id="bn" hidden></label></div></div>`;
  else{const t=IM.st,dup=new Set(S.tx.map(x=>x.src)),neu=IM.tx.filter(x=>!dup.has(x.src)).length;
    h+=`<div class="kv" style="padding:0;border:0"><span>${esc(IM.name)}</span><span class="num">${t.orders} Orders · ${t.fills} Fills</span></div><div class="small">Neu: <b>${neu}</b> · schon vorhanden: ${t.orders-neu}<br>EUR-Wert exakt: ${t.exact} · geschätzt aus Kursen der Datei: ${t.est} · fehlt: ${t.miss}<br>Gebühren: ${Object.entries(t.fees).map(([c,s])=>qty(s)+' '+esc(c)).join(', ')||'–'}${t.feeEst?' · Gebührenwert geschätzt (0,075 % BNB-Satz): '+t.feeEst:''}${t.feeMiss?' · Gebührenwert fehlt: '+t.feeMiss:''}</div>
    <div class="field"><label for="im-w">Ziel-Wallet</label><select id="im-w">${S.wallets.filter(w=>w.st!=='archiv').map(w=>`<option value="${w.id}">${esc(w.n)}</option>`).join('')}<option value="">+ neues Wallet „Binance“</option></select></div>
    <div class="hint">Zeiten bleiben UTC. „Geschätzt“ = Wert aus nahen Kursen derselben Datei (EUR-Paare), später durch echte Kurse ersetzbar.</div><div class="btns"><button class="btn pri" data-act="imGo">${neu} Buchungen importieren</button><button class="btn ghost" data-act="imNo">Abbrechen</button></div></div>`}
  return h+`<div class="card"><h3>Datensicherung</h3><div class="small muted">Aktuell lokal im Gerät gespeichert. Die GitHub-Anbindung kommt im nächsten Schritt.</div><div class="btns"><button class="btn" data-act="exp">Sichern (JSON)</button><label class="btn">Wiederherstellen<input type="file" accept=".json" id="imp" hidden></label></div></div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(a==='go')go(v);
  else if(a==='type'){collect();E.t=v;render()}
  else if(a==='saveE')saveE();
  else if(a==='cancelE'){E=null;render()}
  else if(a==='delE'){S.tx=S.tx.filter(x=>x.i!==E.i);save();E=null;toast('Gelöscht');go('verlauf')}
  else if(a==='edit'){E=toE(S.tx.find(x=>x.i===id));go('buchen')}
  else if(a==='wNew'){W={id:'',n:'',adr:'',net:'',cust:'',st:'aktiv',note:''};go('wallets')}
  else if(a==='wEdit'){W=Object.assign({adr:'',net:'',cust:'',note:''},S.wallets.find(x=>x.id===id));render()}
  else if(a==='wst'){wcollect();W.st=v;render()}
  else if(a==='wMerge'){wcollect();const t=$('#w-merge').value;if(!t)return toast('Ziel-Wallet wählen');const src=W.id;S.tx.forEach(x=>{if(x.w===src)x.w=t;if(x.w2===src)x.w2=t});S.wallets=S.wallets.filter(x=>x.id!==src);W=null;save();toast('Zusammengeführt');render()}
  else if(a==='wCancel'){W=null;render()}
  else if(a==='wSave'){wcollect();if(!W.n.trim())return toast('Name fehlt');if(!W.id){W.id=uid();S.wallets.push(W)}else S.wallets=S.wallets.map(x=>x.id===W.id?W:x);save();W=null;render()}
  else if(a==='price'){const p=prompt('Aktueller Kurs von '+b.dataset.c+' in €',S.cfg.price[b.dataset.c]||'');if(p!==null){const n=num(p);if(n>0)S.cfg.price[b.dataset.c]=n;else delete S.cfg.price[b.dataset.c];save();render()}}
  else if(a==='meth'){S.cfg.meth=v;save();render()}
  else if(a==='heal'){S.cfg.heal=v==='1';save();render()}
  else if(a==='scope'){S.cfg.scope=v;save();render()}
  else if(a==='yr'){YR=v;render()}
  else if(a==='csv'){const R=calc(S.cfg.meth);csvDl('krypto-'+YR+'-'+S.cfg.meth+'.csv','Datum;Coin;Menge;Erwerb;Erlös;Kosten;Gewinn;steuerpflichtig\n'+R.disp.filter(x=>x.d.startsWith(YR)).map(x=>[x.d.slice(0,10),x.c,x.s,x.acq.slice(0,10),x.pr.toFixed(2),x.cost.toFixed(2),x.g.toFixed(2),x.tax?'ja':'nein'].join(';').replace(/\./g,',')).join('\n'))}
  else if(a==='imNo'){IM=null;render()}
  else if(a==='imGo'){let w=$('#im-w').value;if(!w){w=uid();S.wallets.push({id:w,n:'Binance',adr:'',net:'',cust:'',st:'aktiv',note:''})}const n=applyImport(IM.tx,w);IM=null;toast(n+' Buchungen importiert');go('verlauf')}
  else if(a==='exp')saveF('krypto-backup.json',JSON.stringify(S,null,1))
  else if(a==='prices')loadPrices()
  else if(a==='ghSync'){db.sync();toast('Synchronisiere …')}
  else if(a==='ghCode'){$('#ghcode').innerHTML='<textarea readonly rows=4 style="width:100%;font:12px monospace">'+esc(KB.makeCode(KB.ghLoad()))+'</textarea><div class="hint">Enthält deinen Token. Nur dir selbst schicken und danach löschen.</div>'}
  else if(a==='ghOut'){if(confirm('Trennen? Die lokale Kopie wird gelöscht'+(db.pending()?' ('+db.pending()+' Änderungen noch nicht hochgeladen!)':'')+'.')){KB.ghClear();location.reload()}}
  else if(a==='ghGo'){const er=$('#gh-err');let c;try{const code=$('#gh-code').value.trim();c=code?KB.parseCode(code):{owner:$('#gh-o').value.trim(),repo:$('#gh-r').value.trim(),token:$('#gh-t').value.trim()};if(!c.owner||!c.repo||!c.token)throw new Error('Bitte alle drei Felder ausfüllen.')}catch(x){er.textContent=x.message;return}
    er.textContent='Verbinde …';KB.ghConnect(c).then(()=>location.reload()).catch(x=>er.textContent=(x instanceof TypeError)?'Keine Verbindung zu GitHub.':x.message)}});
function wcollect(){if(!W)return;for(const k of['n','adr','net','cust','note']){const el=$('#w-'+k);if(el)W[k]=el.value}}
document.addEventListener('change',e=>{if(e.target.id==='bn'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const r=parseBinance(t);if(r.err)toast(r.err);else{IM=Object.assign(r,{name:f.name});render()}})}
  if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign({wallets:[],tx:[],cfg:{meth:'FIFO',price:{}}},JSON.parse(t));if(db&&!ready)return toast('Noch nicht verbunden, bitte kurz warten');save();toast('Wiederhergestellt');render()}catch(x){toast('Datei ungültig')}})}});
start();
if('serviceWorker' in navigator&&KB&&!KB.isNative()&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
