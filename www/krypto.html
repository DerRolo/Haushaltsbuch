    if(df>0){let p=PXM()[c];if(!(p>0)){const y=prompt('Was waren die '+qty(df)+' '+c+' in Euro wert (Einstand)? 0, wenn unbekannt','0');if(y===null)return;p=(num(y)||0)/df}S.tx.push({i:uid(),t:'bestand',d:now,w,b:c,bs:df,eur:df*p,tag:'Ausgleich',note:'Bestand abgeglichen'})}
    else S.tx.push({i:uid(),t:'verlust',d:now,w,a:c,as:-df,eur:0,tag:'Ausgleich',note:'Bestand abgeglichen'});
    save();toast('Bestand abgeglichen');render()}
  else if(a==='ghSync'){db.sync();toast('Synchronisiere …')}
  else if(a==='ghCode'){$('#ghcode').innerHTML='<textarea readonly rows=4 style="width:100%;font:12px monospace">'+esc(KB.makeCode(KB.ghLoad()))+'</textarea><div class="hint">Enthält deinen Token. Nur dir selbst schicken und danach löschen.</div>'}
  else if(a==='ghOut'){if(confirm('Trennen? Die lokale Kopie wird gelöscht'+(db.pending()?' ('+db.pending()+' Änderungen noch nicht hochgeladen!)':'')+'.')){KB.ghClear();location.reload()}}
  else if(a==='ghGo'){const er=$('#gh-err');let c;try{const code=$('#gh-code').value.trim();c=code?KB.parseCode(code):{owner:$('#gh-o').value.trim(),repo:$('#gh-r').value.trim(),token:$('#gh-t').value.trim()};if(!c.owner||!c.repo||!c.token)throw new Error('Bitte alle drei Felder ausfüllen.')}catch(x){er.textContent=x.message;return}
    er.textContent='Verbinde …';KB.ghConnect(c).then(()=>location.reload()).catch(x=>er.textContent=(x instanceof TypeError)?'Keine Verbindung zu GitHub.':x.message)}});
function wcollect(){if(!W)return;for(const k of['n','adr','net','cust','note']){const el=$('#w-'+k);if(el)W[k]=el.value}}
document.addEventListener('keydown',e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.ac||(e.key!=='Enter'&&e.key!=='Tab'))return;const v=el.value.trim();if(!v)return;const m=[...document.querySelectorAll('#'+el.getAttribute('list')+' option')].map(o=>o.value).find(x=>x.toLowerCase().startsWith(v.toLowerCase()));if(m&&m!==v){el.value=m;if(e.key==='Enter')e.preventDefault()}});
document.addEventListener('change',e=>{if(e.target.id&&e.target.id.indexOf('vf-')===0){VF[e.target.id.slice(3)]=e.target.value;render();return}
  if(e.target.id==='impf'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const r=(SRC.find(x=>x.id===IMPV)||SRC[0]).parse(t);if(r.err)toast(r.err);else{IM=Object.assign(r,{name:f.name});render()}})}
  if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign({wallets:[],tx:[],cfg:{meth:'FIFO',price:{}}},JSON.parse(t));if(db&&!ready)return toast('Noch nicht verbunden, bitte kurz warten');save();toast('Wiederhergestellt');render()}catch(x){toast('Datei ungültig')}})}});
window.addEventListener('popstate',e=>{const q=e.state;if(!q)return;view=q.view||'uebersicht';MENU=false;WARNW=null;IMPV=q.imp||null;
  E=q.e?(q.e==='new'?newE():(S.tx.find(t=>t.i===q.e)?toE(S.tx.find(t=>t.i===q.e)):null)):null;
  W=q.w?(q.w==='new'?{id:'',n:'',adr:'',net:'',cust:'',st:'aktiv',note:''}:Object.assign({adr:'',net:'',cust:'',note:''},S.wallets.find(x=>x.id===q.w)||{})):null;render()});
document.addEventListener('pointermove',chMove);document.addEventListener('pointerdown',chMove);
start();
if('serviceWorker' in navigator&&KB&&!KB.isNative()&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
