<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: schmale Spalte (max 760px), Kopfzeile mit Vermögen, Tab-Leiste unten am Handy / oben am PC, Formulare als Bottom-Sheet */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#15201C; --muted:#5E6B66; --line:#DCE2DF;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --soft:#E4EEEB; --pos:#16794A; --neg:#B23A2E; --warn:#9A6A12;
  --c1:#0E6B5B; --c2:#2F5FA8; --c3:#B7791F; --c4:#8A4F9E; --scrim:rgba(10,20,16,.45);
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --ink:#E5ECE8; --muted:#97A39E; --line:#2A3430;
  --accent:#4DBFA3; --accent-ink:#0B1411; --soft:#1F2C28; --pos:#5CCB93; --neg:#F0877B; --warn:#E0B05A;
  --c1:#4DBFA3; --c2:#7FA6E8; --c3:#E0B05A; --c4:#C79AD8; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --ink:#E5ECE8; --muted:#97A39E; --line:#2A3430;
  --accent:#4DBFA3; --accent-ink:#0B1411; --soft:#1F2C28; --pos:#5CCB93; --neg:#F0877B; --warn:#E0B05A;
  --c1:#4DBFA3; --c2:#7FA6E8; --c3:#E0B05A; --c4:#C79AD8; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
header.top h1{font:700 20px/1.1 var(--f-head);margin:0;letter-spacing:-.01em}
header.top .sum{font:500 12px var(--f-body);color:var(--muted);margin-top:3px}
header.top .sum b{font-family:var(--f-head);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.sync.wait i{background:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px));scrollbar-width:none}
nav.tabs button{flex:1 0 auto;min-width:76px;border:0;background:none;padding:13px 10px;font-weight:500;color:var(--muted);border-top:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:860px){
  nav.tabs{position:static;border:0;border-bottom:1px solid var(--line);background:none;padding:0;margin:0 auto;max-width:760px}
  nav.tabs button{border-top:0;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button.on{border-bottom-color:var(--accent)}
  body{padding-block:0 40px}
}
main{padding:16px 0 8px;display:flex;flex-direction:column;gap:16px}
h2{font:700 16px/1.2 var(--f-head);margin:0}
h3{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{padding:0;gap:0;overflow:hidden}
.muted{color:var(--muted)} .small{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:700 24px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0;min-height:42px}
input[type=checkbox]{width:auto;min-height:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.amt-in{font:700 22px var(--f-head);font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2.keep{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--neg)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px}
.btn.ghost{background:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;min-height:32px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.tpl{background:var(--surface);text-align:left;line-height:1.2}
.chip.tpl small{display:block;color:var(--muted);font-size:11px}
.grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 -2px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;min-width:0}
.list>.row:first-child{border-top:0}
.row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .mid{min-width:0;display:flex;flex-direction:column}
.row .mid b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.kv:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink);margin-right:4px}
.tag.st{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-top:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
tfoot td{font-weight:700}
.bar-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.banner{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
#modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:14px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:50;font-weight:500;max-width:90%;display:none}
#toast.on{display:block}
#toast .tbtn{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;margin-left:14px;padding:4px 2px;cursor:pointer}
.dtrow{display:flex;gap:4px;align-items:stretch}.dtrow input{flex:1;min-width:0;text-align:center;padding-left:2px;padding-right:2px;font-size:14px}.dtrow .btn{min-width:28px;padding:0 4px;min-height:0;font-size:16px}
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:2px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:260px;overflow:auto}
.aci{padding:9px 12px;font-size:14px;cursor:pointer}.aci.on{background:var(--accent);color:var(--accent-ink)}
.rwrap{display:flex;align-items:center;border-top:1px solid var(--line)}.rwrap .row{border-top:0;flex:1;min-width:0}.rwrap .btn{margin-right:10px;flex:none}
.hint{font-size:12px;color:var(--muted);min-height:16px}
svg text{fill:var(--muted);font:10px var(--f-body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
details[open]{display:flex;flex-direction:column;gap:10px}
summary{cursor:pointer;font-weight:500}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s}}
</style>

<div id="app">
  <header class="top">
    <div><h1>Haushaltsbuch</h1><div class="sum" id="hsum">Lade Daten …</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="sync wait" id="sync"><i></i><span>verbinde …</span></div>
      <button class="btn sm ghost" data-act="go" data-v="einstellungen">Einstellungen</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<datalist id="dl-names"></datalist>
<datalist id="dl-groups"></datalist>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="gh.js"></script>
<script>
'use strict';
/* ---------- Hilfsfunktionen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const r2=n=>(Math.round(n*100)/100)||0;
const eur=n=>nf.format(r2(n))+' €';
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?m[3]+'.'+m[2]+'.'+m[1]:(s||'')};
const pds=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?m[3]+'.'+m[2]+'.':(s||'')};
const parseNum=s=>{s=String(s==null?'':s).trim().replace(/\s/g,'').replace('€','');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN};
const numIn=n=>String(Math.round(n*100)/100).replace('.',',');
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const lc=s=>String(s||'').trim().toLowerCase();
const sgn=(n,plus)=>{n=r2(n);return(n<0?'−':(plus&&n>0?'+':''))+nf.format(Math.abs(n))+' €'};
function addM(iso,n,anchor){const p=iso.split('-').map(Number);const t=p[0]*12+(p[1]-1)+n;const y=Math.floor(t/12),m=t%12;const dim=new Date(y,m+1,0).getDate();return y+'-'+pad(m+1)+'-'+pad(Math.min(anchor,dim))}
function dues(r,until){const out=[],a=+r.start.slice(8,10);for(let k=0;k<700;k++){const d=addM(r.start,r.iv*k,a);if(d>until)break;if(!r.last||d>r.last)out.push(d)}return out}
function nextDue(r){const a=+r.start.slice(8,10);for(let k=0;k<700;k++){const d=addM(r.start,r.iv*k,a);if(!r.last||d>r.last)return d}return ''}
function toast(msg,act){const t=$('#toast');t.textContent=msg;if(act){const b=document.createElement('button');b.type='button';b.className='tbtn';b.textContent=act.label;b.onclick=()=>{t.classList.remove('on');act.fn()};t.appendChild(b)}t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),act?8000:3200)}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function isoAdd(iso,n){const [y,m,d]=iso.split('-').map(Number);return isoOf(new Date(y,m-1,d+n))}
/* Datumseingabe: "5" "5.3" "5.3.25" "5.3.2025" "+1" "-2" "h"(eute) "g"(estern); Jahr bleibt das des bisherigen Datums */
function parseDateIn(txt,base){
  txt=String(txt||'').trim();if(!txt)return base;
  let m=/^([+-])\s*(\d{1,4})$/.exec(txt);if(m)return isoAdd(base,(m[1]==='-'?-1:1)*(+m[2]));
  if(/^h(eute)?$/i.test(txt))return today();if(/^g(estern)?$/i.test(txt))return isoAdd(today(),-1);
  m=/^(\d{1,2})\.?(?:(\d{1,2})\.?(?:(\d{4}|\d{2}))?)?$/.exec(txt);if(!m)return '';
  const d=+m[1],mo=m[2]?+m[2]:+base.slice(5,7);let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+base.slice(0,4);
  if(mo<1||mo>12||d<1||d>new Date(y,mo,0).getDate())return '';
  return y+'-'+pad(mo)+'-'+pad(d);
}
function dateIn(p,iso){return `<div class="dtrow"><button type="button" class="btn sm" data-act="dstep" data-p="${p}" data-n="-1" aria-label="Einen Tag zurück" tabindex="-1">‹</button><input id="${p}-date" class="dt" data-iso="${iso}" value="${pd(iso)}" inputmode="numeric" autocomplete="off" aria-label="Datum"><button type="button" class="btn sm" data-act="dstep" data-p="${p}" data-n="1" aria-label="Einen Tag vor" tabindex="-1">›</button></div>`}
function setDate(p,iso){const i=$('#'+p+'-date');i.dataset.iso=iso;i.value=pd(iso)}
function getDate(p){const i=$('#'+p+'-date');const iso=parseDateIn(i.value,i.dataset.iso||today());if(!iso)return '';setDate(p,iso);return iso}
function updPrev(p){
  const el=$('#'+p+'-prev');if(!el)return;const i=$('#'+p+'-date');if(!i)return;
  const iso=parseDateIn(i.value,i.dataset.iso||today());const b=parseNum(($('#'+p+'-amt')||{}).value);
  const v=($('#'+p+'-von')||{}).value||'',n=($('#'+p+'-nach')||{}).value||'';
  el.textContent=iso?WD[new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)).getDay()]+' '+pd(iso)+(isNaN(b)?'':' · '+eur(b))+(v||n?' · '+(v||'?')+' → '+(n||'?'):''):'Datum nicht erkannt';
}

/* ---------- Standardwerte ---------- */
function defCfg(){return{stichtag:today(),konten:[],pausch:0.30,regeln:[],fahrzeuge:[],
 kats:[...['Gehalt','Nebeneinkommen','Taschengeld','Provision','Bonus Reward','Geschenke','Dividenden'].map(n=>({n,typ:'ein',a:true})),{n:'Rückerstattung',typ:'rue',a:true},{n:'Übertrag',typ:'int',a:true},{n:'Ausgleich',typ:'int',a:true},...['Fixkosten','Spaßkosten','Andere','Investieren'].map(n=>({n,typ:'aus',a:true}))],
 zusatz:['Lebensmittel','Auto','Fahrtkosten','Abos','Versicherungen','Bildung','Arznei','Steuern','Spenden','Kontoführungsgebühren'].map(n=>({n,a:true})),
 steuerKats:['Studium/Bildung','Fahrtkosten','Arbeitsmittel','Spenden','Versicherungen','Krankheitskosten','Sonstiges'].map(n=>({n,a:true}))}}
const TYP_LABEL={ein:'Einnahme',aus:'Ausgabe',rue:'Rückerstattung',int:'Intern'};

/* ---------- Zustand ---------- */
const S={cfg:null,months:new Map(),sprit:new Map(),steuer:new Map(),asc:[],all:[],byId:new Map(),
 got:{c:false,m:false},fresh:{c:false,m:false},view:'eintragen',
 bf:{from:'',to:'',q:'',konto:'',cat:'',st:false,lim:150},
 av:{mode:'kat',range:'month',y:new Date().getFullYear(),m:new Date().getMonth(),yy:new Date().getFullYear(),grp:'all'},
 sy:new Date().getFullYear(),sv:{id:'',year:'all',arch:false,tab:'ueb',mode:'ges',art:''},kArch:false,booted:false};
let db=null;
const dirty={m:new Map(),c:0,s:new Map(),t:new Map()};
let chain=Promise.resolve();
const enqueue=fn=>{chain=chain.then(fn).catch(e=>toast('Speichern fehlgeschlagen: '+((e&&(e.message||e.code))||e)));return chain};
function mark(map,key){map.set(key,(map.get(key)||0)+1)}
function unmark(map,key){const n=(map.get(key)||1)-1;if(n<=0)map.delete(key);else map.set(key,n)}
const CFG=()=>S.cfg||(S.cfg=defCfg());
function saveMonth(key){mark(dirty.m,key);enqueue(()=>db.doc('monate/'+key).set({e:S.months.get(key)||[]}).finally(()=>unmark(dirty.m,key)))}
function saveCfg(){dirty.c++;enqueue(()=>db.doc('config/main').set(clone(CFG())).finally(()=>{dirty.c--}))}
function saveSprit(id){mark(dirty.s,id);enqueue(()=>db.doc('sprit/'+id).set({f:S.sprit.get(id)||[]}).finally(()=>unmark(dirty.s,id)))}
function saveSteuer(y){mark(dirty.t,y);enqueue(()=>db.doc('steuer/'+y).set(S.steuer.get(y)||{fahrten:[],kosten:[]}).finally(()=>unmark(dirty.t,y)))}

/* ---------- Abgeleitete Daten ---------- */
function rebuild(){
  const all=[];S.months.forEach(a=>a.forEach(e=>all.push(e)));
  all.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  S.asc=all;S.all=[...all].reverse();S.byId=new Map(all.map(e=>[e.i,e]));
  const fr=new Map();
  for(const e of all){for(const n of [e.v,e.n]){if(n)fr.set(n,(fr.get(n)||0)+1)}}
  S.names=[...fr.entries()].sort((a,b)=>b[1]-a[1]).slice(0,400).map(x=>x[0]);
  const lb=new Map();for(const e of all){lb.set(lc(isKonto(e.n)?e.v:e.n),e)}S.lastBy=lb;
}
const konten=()=>CFG().konten;
const kMap=()=>{const m=new Map();konten().forEach(k=>m.set(lc(k.n),k));return m};
const isKonto=n=>kMap().has(lc(n));
const katOf=n=>CFG().kats.find(k=>k.n===n);
const typOf=e=>{const k=katOf(e.k);return k?k.typ:(e.k?'aus':'none')};
function eff(e){if(typOf(e)!=='aus')return e.k||'Ohne Kategorie';const z=e.z||[];if(z.length){const order=CFG().zusatz.map(x=>x.n);let best=z[0],bi=1e9;for(const x of z){const i=order.indexOf(x);if(i>=0&&i<bi){bi=i;best=x}}return best}return e.k}
function balances(until){
  const st=CFG().stichtag,t=until||today(),m=kMap(),bal={};
  konten().forEach(k=>bal[lc(k.n)]=+k.start||0);
  for(const e of S.asc){if(e.d<=st||e.d>t)continue;const n=lc(e.n),v=lc(e.v);if(m.has(n))bal[n]+=e.b;if(m.has(v))bal[v]-=e.b}
  return bal;
}
function totals(list){
  let ein=0,aus=0,rue=0;const cats=new Map();
  for(const e of list){const ty=typOf(e);if(ty==='int'||ty==='none')continue;const c=eff(e);const o=cats.get(c)||{sum:0,n:0,typ:ty};
    if(ty==='ein'){ein+=e.b;o.sum+=e.b}else if(ty==='rue'){rue+=e.b;o.sum+=e.b}else{aus+=e.b;o.sum+=e.b}o.n++;cats.set(c,o)}
  return{ein,aus:aus-rue,rue,cats};
}
function history(){
  const st=CFG().stichtag,t=today(),ks=konten(),m=kMap(),cum={};
  ks.forEach(k=>cum[lc(k.n)]=+k.start||0);
  const groups=[...new Set(ks.map(k=>k.g||'Sonstige'))];
  const out=[];let i=0;const asc=S.asc.filter(e=>e.d>st&&e.d<=t);
  let [y,mo]=st.slice(0,7).split('-').map(Number);const [ey,em]=t.slice(0,7).split('-').map(Number);
  while(y<ey||(y===ey&&mo<=em)){
    const key=y+'-'+pad(mo);
    while(i<asc.length&&asc[i].d.slice(0,7)<=key){const e=asc[i++],n=lc(e.n),v=lc(e.v);if(m.has(n))cum[n]+=e.b;if(m.has(v))cum[v]-=e.b}
    const g={};groups.forEach(x=>g[x]=0);let tot=0;
    ks.forEach(k=>{const b=cum[lc(k.n)];g[k.g||'Sonstige']+=b;tot+=b});
    out.push({m:key,tot,g});mo++;if(mo>12){mo=1;y++}
  }
  return{pts:out,groups};
}

function autoBook(){
  const cfg=CFG();let n=0,changed=false;const t=today();
  for(const r of cfg.regeln){
    if(r.a===false||r.auto===false)continue;
    const ds=dues(r,t);if(!ds.length)continue;
    for(const d of ds){if(!S.byId.has('r_'+r.id+'_'+d)){putEntry(ruleEntry(r,d));n++}}
    r.last=ds[ds.length-1];changed=true;
  }
  if(changed){saveCfg();rebuild();refresh()}
  if(n)toast(n+(n===1?' fällige Buchung':' fällige Buchungen')+' automatisch gebucht');
}

  if(c.ak==='Sprit'&&c.fz){const l=S.sprit.get(c.fz)||[];fill=l.find(x=>x.d===c.d&&Math.abs(x.p-c.b)<.005)||null;if(fill){S.sprit.set(c.fz,l.filter(x=>x!==fill));saveSprit(c.fz)}}
  removeEntry(id);
  const want=fill?'t':'b';if(S.emode!==want||!($('#'+(want==='t'?'t-p':'f-amt')))){S.emode=want;render()}
  if(fill){$('#t-fz').value=c.fz;setDate('t',c.d);$('#t-p').value=numIn(fill.p);$('#t-ppl').value=String(fill.ppl).replace('.',',');$('#t-km').value=fill.km==null?'':fill.km;if([...$('#t-konto').options].some(o=>o.value===c.v))$('#t-konto').value=c.v;tankPrev()}
  else setForm(c);
  window.scrollTo({top:0,behavior:'smooth'});const a=$(fill?'#t-p':'#f-amt');a.focus();a.select();
  toast('Zurückgenommen – Eingaben stehen wieder im Formular');
}
function tankPrev(){const el=$('#t-prev');if(!el)return;const p=parseNum($('#t-p').value),ppl=parseNum($('#t-ppl').value);el.textContent=(!isNaN(p)&&!isNaN(ppl)&&ppl>0)?'≈ '+nf.format(p/ppl)+' Liter':''}

/* Autocomplete für Von / Nach (Enter wählt nur, wenn ein Eintrag markiert ist) */
const AC={inp:null,idx:-1,items:[]};
function acItems(q){
  const names=[...konten().filter(k=>k.a!==false).map(k=>k.n),...(S.names||[])].filter((v,i,a)=>a.indexOf(v)===i);q=lc(q);
  if(!q)return names.slice(0,8);
  return [...names.filter(n=>lc(n).startsWith(q)),...names.filter(n=>!lc(n).startsWith(q)&&lc(n).includes(q))].slice(0,8);
}
function acBox(inp){let b=inp.parentNode.querySelector('.ac');if(!b){inp.parentNode.classList.add('acw');b=document.createElement('div');b.className='ac';b.hidden=true;inp.parentNode.appendChild(b)}return b}
function acShow(inp){
  const q=inp.value.trim(),items=acItems(q).filter(n=>lc(n)!==lc(q));const b=acBox(inp);
  AC.inp=inp;AC.items=items;AC.idx=q&&items.length?0:-1;
  if(!items.length){b.hidden=true;return}
  b.hidden=false;acDraw();
}
function acDraw(){const b=acBox(AC.inp);b.innerHTML=AC.items.map((n,i)=>`<div class="aci ${i===AC.idx?'on':''}" data-v="${esc(n)}">${esc(n)}</div>`).join('')}
function acHide(){document.querySelectorAll('.ac').forEach(b=>b.hidden=true);AC.idx=-1;AC.items=[]}
const acOpen=()=>AC.inp&&!acBox(AC.inp).hidden&&AC.items.length;
function acPick(v){
  const inp=AC.inp;if(!inp)return;inp.value=v;acHide();const p=inp.id.split('-')[0];
  if(inp.id.endsWith('-nach'))fillFromKnown(p);else if(isKonto($('#'+p+'-nach').value))fillFromKnown(p);
  updPrev(p);const nx=$('#'+p+(inp.id.endsWith('-von')?'-nach':'-info'));if(nx){nx.focus();if(nx.select)nx.select()}
}
const FORM_ORDER={s:['date','amt','von','nach','info'],f:['date','amt','von','nach','info'],m:['date','amt','von','nach','info'],t:['fz','date','p','ppl','km','konto']};
function submitForm(f){if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))}
function eKey(ev){
  const t=ev.target,f=t.form;if(!f||!t.id||!/^(f|m|t|s|u)-/.test(t.id))return;
  const p=t.id.split('-')[0],field=t.id.slice(p.length+1);
  if(t.dataset.ac&&acOpen()){
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const n=AC.items.length;AC.idx=ev.key==='ArrowDown'?(AC.idx+1)%n:(AC.idx<=0?n-1:AC.idx-1);acDraw();return}
    if(ev.key==='Enter'&&AC.idx>=0){ev.preventDefault();ev.stopPropagation();acPick(AC.items[AC.idx]);return}
    if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();acHide();return}
  }else if(t.dataset.ac&&(ev.key==='ArrowDown')){ev.preventDefault();acShow(t);return}
  if(t.classList.contains('dt')&&(ev.key==='ArrowUp'||ev.key==='ArrowDown')){
    ev.preventDefault();const cur=parseDateIn(t.value,t.dataset.iso||today())||t.dataset.iso;setDate(p,isoAdd(cur,(ev.key==='ArrowUp'?1:-1)*(ev.shiftKey?7:1)));updPrev(p);return;
  }
  if(ev.key!=='Enter'||ev.isComposing)return;
  if(ev.ctrlKey||ev.metaKey){ev.preventDefault();submitForm(f);return}
  const order=FORM_ORDER[p];if(!order)return;
  const i=order.indexOf(field);if(i<0)return;
  if(i<order.length-1){
    ev.preventDefault();
    if(t.classList.contains('dt')){if(!getDate(p)){toast('Datum nicht erkannt (z. B. 5.3. oder +1)');return}updPrev(p)}
    const nx=$('#'+p+'-'+order[i+1]);if(nx){nx.focus();if(nx.select)nx.select()}
  }else{ev.preventDefault();submitForm(f)}
}

function rangeOf(){
  const a=S.av;
  if(a.range==='month'){const f=a.y+'-'+pad(a.m+1)+'-01',t=a.y+'-'+pad(a.m+1)+'-31';return{from:f,to:t,label:MONL[a.m]+' '+a.y}}
  if(a.range==='year')return{from:a.y+'-01-01',to:a.y+'-12-31',label:'Jahr '+a.y};
  return{from:'0000',to:'9999',label:'Gesamter Zeitraum'};
}
function catTable(cats,typ,total){
  const rows=[...cats.entries()].filter(([,o])=>typ==='ein'?o.typ==='ein':o.typ!=='ein').sort((a,b)=>Math.abs(b[1].sum)-Math.abs(a[1].sum));
  if(!rows.length)return '<div class="empty">Keine Buchungen.</div>';
  const max=Math.max(...rows.map(r=>Math.abs(r[1].sum)),1);
  return rows.map(([c,o])=>`<button class="kv" data-act="aCat" data-c="${esc(c)}"><span style="min-width:0"><b>${esc(c)}</b> <span class="muted small">${o.n}×</span><span class="bar" style="display:block"><i style="display:block;width:${Math.abs(o.sum)/max*100}%;${o.typ==='rue'?'background:var(--pos)':''}"></i></span></span><span class="num ${o.typ==='aus'?'':'pos'}" style="font-weight:600">${nf.format(o.sum)} €${total?` <span class="muted small">${Math.round(o.sum/total*100)}%</span>`:''}</span></button>`).join('');
}

  }else{
    h+=entwicklung();

function chartSVG(series,labels){
  const W=640,H=230,L=52,R=14,T=12,B=26;const all=series.flatMap(s=>s.v);let mn=Math.min(0,...all),mx=Math.max(...all);if(mx===mn)mx=mn+1;
  const step=(()=>{const r=(mx-mn)/4;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})();
  const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const X=i=>L+(W-L-R)*(labels.length<2?0:i/(labels.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${nf0.format(v)}</text>`;
  labels.forEach((m,i)=>{if(m.endsWith('-01')||i===0){g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${m.slice(0,4)}</text>`}});
  const lines=series.map(s=>{const d=s.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');const li=s.v.length-1;
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" stroke-linejoin="round"/><circle cx="${X(li)}" cy="${Y(s.v[li])}" r="3.2" fill="${s.c}"/>`}).join('');
  return `<div class="tbl"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Vermögensverlauf">${g}${lines}</svg></div>`;
}
function yearRows(){
  const ys=new Map();
  for(const e of S.asc){const y=e.d.slice(0,4);if(!ys.has(y))ys.set(y,[]);ys.get(y).push(e)}
  return[...ys.entries()].map(([y,l])=>({y,t:totals(l),list:l}));
}
function entwicklung(){
  const hist=history(),cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
  const gsel=S.av.grp;const gs=hist.groups.filter(g=>g!=='Sonstige'||hist.pts.some(p=>Math.abs(p.g[g])>1));

  const yr=yearRows().reverse(),sel=S.av.yy;

  let h=`<div class="card"><h2>Vermögen im Zeitverlauf</h2>${chartSVG(series,hist.pts.map(p=>p.m))}<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div><div class="small muted">Monatsende, alle Konten inklusive archivierter. Start am ${pd(CFG().stichtag)}.</div></div>`;
  h+=`<div class="card flat"><div style="padding:12px 14px"><h3>Jahresübersicht</h3></div><div class="tbl"><table><thead><tr><th>Jahr</th><th>Einnahmen</th><th>Ausgaben</th><th>Übrig</th><th>Quote</th><th>Vermögen Ende</th></tr></thead><tbody>${yr.map(r=>{const o=r.t.ein-r.t.aus,q=r.t.ein>0?Math.round(o/r.t.ein*100)+' %':'–',v=endTot(r.y);return `<tr class="click" data-act="aYear" data-y="${r.y}" ${+r.y===sel?'style="background:var(--soft)"':''}><td>${r.y}</td><td>${nf0.format(r.t.ein)}</td><td>${nf0.format(r.t.aus)}</td><td class="${o<0?'neg':'pos'}">${nf0.format(o)}</td><td>${q}</td><td>${v==null?'–':nf0.format(v)}</td></tr>`}).join('')}</tbody></table></div></div>`;
  const ml=S.asc.filter(e=>e.d.startsWith(String(sel)));
  const rows=[];for(let m=1;m<=12;m++){const l=ml.filter(e=>+e.d.slice(5,7)===m);if(!l.length)continue;const t=totals(l);rows.push(`<tr><td>${MON[m-1]}</td><td>${nf0.format(t.ein)}</td><td>${nf0.format(t.aus)}</td><td class="${t.ein-t.aus<0?'neg':'pos'}">${nf0.format(t.ein-t.aus)}</td></tr>`)}
  h+=`<div class="card flat"><div style="padding:12px 14px"><h3>Monate ${sel}</h3></div><div class="tbl"><table><thead><tr><th>Monat</th><th>Einnahmen</th><th>Ausgaben</th><th>Übrig</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="4" class="muted">Keine Daten</td></tr>'}</tbody></table></div></div>`;
  const yrs=yr.map(r=>r.y).slice(0,8).reverse();const cm=new Map();
  for(const r of yr){if(!yrs.includes(r.y))continue;r.t.cats.forEach((o,c)=>{if(o.typ==='aus'){const x=cm.get(c)||{};x[r.y]=(x[r.y]||0)+o.sum;cm.set(c,x)}})}
  const crow=[...cm.entries()].sort((a,b)=>Object.values(b[1]).reduce((s,x)=>s+x,0)-Object.values(a[1]).reduce((s,x)=>s+x,0));
  h+=`<div class="card flat"><div style="padding:12px 14px"><h3>Ausgaben pro Kategorie und Jahr</h3></div><div class="tbl"><table><thead><tr><th>Kategorie</th>${yrs.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${crow.map(([c,x])=>`<tr><td>${esc(c)}</td>${yrs.map(y=>`<td>${x[y]?nf0.format(x[y]):'–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="btns"><button class="btn" data-act="pdfJahr">Jahresübersicht als PDF</button></div>`;
  return h;
}

function ausgleichEntry(konto,ist,soll,d){
  const diff=Math.round((ist-soll)*100)/100;if(!diff)return null;
  const e={i:uid('e'),d,t:'Ausgleich: Kontostand '+numIn(ist)+' € statt '+numIn(soll)+' €',k:'Ausgleich'};

/* --- Steuer --- */
function stDoc(y){if(!S.steuer.has(y))S.steuer.set(y,{fahrten:[],kosten:[]});return S.steuer.get(y)}
function steuerData(y){

}
const STMAP={Bildung:'Studium/Bildung',Spenden:'Spenden',Arznei:'Krankheitskosten',Versicherungen:'Versicherungen',Fahrtkosten:'Fahrtkosten'};

  <div class="card flat"><div style="padding:12px 14px"><h3>Markierte Buchungen (${d.ent.length})</h3></div><div class="list">${d.ent.slice().reverse().map(rowHTML).join('')||'<div class="empty">Keine.</div>'}</div></div>
  ${cand.length?`<div class="card flat"><div style="padding:12px 14px"><h3>Mögliche Kandidaten (${cand.length})</h3><div class="small muted">Gebucht mit Zusatz wie Bildung, Spenden, Arznei oder Versicherungen, aber noch nicht für die Steuer markiert.</div></div><div class="list">${cand.slice().reverse().map(e=>`<div class="row" style="grid-template-columns:48px 1fr auto auto"><span class="d">${pds(e.d)}</span><span class="mid"><b>${esc(e.n)}</b><small>${esc(e.t||'')}</small></span><span class="amt num">${eur(e.b)}</span><button class="btn sm" data-act="stMark" data-id="${esc(e.i)}">Markieren</button></div>`).join('')}</div></div>`:''}

/* --- Sprit --- */
const vehicles=()=>CFG().fahrzeuge;
function curVeh(){const l=vehicles().filter(v=>v.a!==false||S.sv.arch);let v=vehicles().find(x=>x.id===S.sv.id&&(x.a!==false||S.sv.arch));if(!v)v=l[0];return v}
function spritCalc(vid){
  const f=[...(S.sprit.get(vid)||[])].sort((a,b)=>a.d<b.d?-1:1),out=[];
  f.forEach((x,i)=>{const p=f[i-1],liter=x.p/x.ppl;let dk=null,days=null;
    if(p){days=Math.round((new Date(x.d)-new Date(p.d))/864e5);if(x.km!=null&&p.km!=null&&x.km>p.km)dk=x.km-p.km}
    out.push({...x,liter,dk,days,l100:dk?liter/dk*100:null,ekm:dk?x.p/dk:null})});
  return out;
}
function vehItems(v){
  const items=[];(S.sprit.get(v.id)||[]).forEach(f=>items.push({d:f.d,art:'Sprit',b:f.p}));
  S.asc.forEach(e=>{if(e.fz===v.id&&e.ak!=='Sprit'&&typOf(e)==='aus')items.push({d:e.d,art:e.ak||'Sonstiges',b:e.b})});
  return items;
}
const svEntries=v=>S.asc.filter(e=>e.fz===v.id&&e.ak!=='Sprit'&&typOf(e)==='aus');
function monthsSpan(items,sel){
  const n=new Date();
  if(sel!=='all'){return +sel===n.getFullYear()?n.getMonth()+1:12}
  if(!items.length)return 1;const f=items.reduce((m,i)=>i.d<m?i.d:m,items[0].d);
  return Math.max(1,(n.getFullYear()-+f.slice(0,4))*12+n.getMonth()-(+f.slice(5,7)-1)+1);
}
V.auto=()=>{

  const items=vehItems(v);
  const years=[...new Set([...items.map(i=>i.d.slice(0,4)),String(new Date().getFullYear())])].sort().reverse();
  if(sv.year!=='all'&&!years.includes(sv.year))sv.year='all';
  let h=`<div class="card"><div class="bar-nav"><select id="sv-v" style="flex:1;min-width:140px" aria-label="Fahrzeug">${vehicles().filter(x=>x.a!==false||sv.arch).map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.n)}${x.a===false?' (Archiv)':''}</option>`).join('')}</select>
  <select id="sv-y" style="width:auto" aria-label="Jahr"><option value="all">Alle Jahre</option>${years.map(y=>`<option ${y===sv.year?'selected':''}>${y}</option>`).join('')}</select></div>
  <div class="seg" style="align-self:flex-start">${[['ueb','Kosten'],['scheck','Scheckheft'],['tank','Tankbuch']].map(([k,l])=>`<button class="${sv.tab===k?'on':''}" data-act="vTab" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="btns"><button class="btn sm" data-act="vNew">Neues Fahrzeug</button><button class="btn sm" data-act="vToggle" data-id="${v.id}">${v.a===false?'Wieder aktivieren':'Archivieren'}</button>${archN||sv.arch?`<button class="btn sm ghost" data-act="vArch">${sv.arch?'Archiv ausblenden':'Archiv anzeigen ('+archN+')'}</button>`:''}</div></div>`;
  return h+(sv.tab==='scheck'?autoScheck(v):sv.tab==='tank'?autoTank(v):autoUeb(v,items));
};
function autoUeb(v,items){
  const sv=S.sv,sel=sv.year,mode=sv.mode;
  const inY=items.filter(i=>sel==='all'||i.d.startsWith(sel));
  const order=['Sprit',...AK],tot=inY.reduce((s,i)=>s+i.b,0);
  const sumBy=l=>{const m=new Map();l.forEach(i=>m.set(i.art,(m.get(i.art)||0)+i.b));return m};
  const km=spritCalc(v.id).filter(r=>(sel==='all'||r.d.startsWith(sel))&&r.dk).reduce((s,r)=>s+r.dk,0);
  const months=monthsSpan(inY,sel),nYears=sel==='all'?Math.max(1,new Set(inY.map(i=>i.d.slice(0,4))).size):1;
  const big=mode==='ges'?['Kosten gesamt',tot]:mode==='jaehr'?['Ø pro Jahr',tot/nYears]:['Ø pro Monat',tot/months];
  const vt=v.typ||'Auto';
  const unassigned=S.asc.filter(e=>!e.fz&&(e.z||[]).includes(vt)&&typOf(e)==='aus'&&!(e.z||[]).includes('Fahrtkosten')&&lc(e.n)!=='tankstelle').length;
  let h=`<div class="card"><div class="seg" style="align-self:flex-start"><button class="${mode==='ges'?'on':''}" data-act="vMode" data-v="ges">Gesamt</button><button class="${mode==='jaehr'?'on':''}" data-act="vMode" data-v="jaehr">Jährlich</button><button class="${mode==='mon'?'on':''}" data-act="vMode" data-v="mon">Monatlich</button></div>
  <div class="grid"><div><h3>${big[0]}</h3><div class="big">${eur(big[1])}</div></div><div><h3>Pro Kilometer</h3><div class="big">${km?nf.format(tot/km)+' €':'–'}</div><div class="small muted">${km?nf0.format(km)+' km laut Tankbuch':'Kilometerstände im Tankbuch fehlen'}</div></div></div></div>`;
  const arts=order.filter(a=>items.some(i=>i.art===a));
  if(!items.length)return h+'<div class="card empty">Noch keine Kosten für dieses Fahrzeug. Tankvorgänge kommen aus dem Tankbuch, alles andere aus Buchungen mit Fahrzeug und Art (Feld „Auto / Scheckheft“ beim Buchen).</div>';
  if(mode==='ges'){
    const m=sumBy(inY),mx=Math.max(...m.values(),1),cnt=a=>inY.filter(i=>i.art===a).length;
    h+=`<div class="card flat"><div class="list">${order.filter(a=>m.has(a)).map(a=>`<div class="kv"><span style="min-width:0"><b>${esc(a)}</b> <span class="muted small">${cnt(a)}×</span><span class="bar" style="display:block"><i style="display:block;width:${m.get(a)/mx*100}%"></i></span></span><span class="num" style="font-weight:600">${eur(m.get(a))} <span class="muted small">${tot?Math.round(m.get(a)/tot*100):0}%</span></span></div>`).join('')||'<div class="empty">Nichts im Zeitraum.</div>'}</div></div>`;
  }else if(mode==='jaehr'){
    const ys=[...new Set(items.map(i=>i.d.slice(0,4)))].sort().reverse().slice(0,8).reverse();
    const by=new Map(ys.map(y=>[y,sumBy(items.filter(i=>i.d.startsWith(y)))]));
    h+=`<div class="card flat"><div class="tbl"><table><thead><tr><th>Art</th>${ys.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${arts.map(a=>`<tr><td>${esc(a)}</td>${ys.map(y=>`<td>${by.get(y).has(a)?nf0.format(by.get(y).get(a)):'–'}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Summe</td>${ys.map(y=>`<td>${nf0.format([...by.get(y).values()].reduce((s,x)=>s+x,0))}</td>`).join('')}</tr></tfoot></table></div></div>`;
  }else if(sel==='all'){
    const m=sumBy(inY);
    h+=`<div class="card flat"><div class="list">${order.filter(a=>m.has(a)).map(a=>`<div class="kv"><span><b>${esc(a)}</b></span><span class="num" style="font-weight:600">${eur(m.get(a)/months)} <span class="muted small">pro Monat</span></span></div>`).join('')}</div></div><div class="small muted">Durchschnitt über ${months} Monate seit der ersten Kostenbuchung.</div>`;
  }else{
    const by=[];for(let i=1;i<=12;i++)by.push(sumBy(inY.filter(x=>+x.d.slice(5,7)===i)));
    h+=`<div class="card flat"><div class="tbl"><table><thead><tr><th>Art</th>${MON.map(x=>`<th>${x}</th>`).join('')}<th>Summe</th><th>Ø/Monat</th></tr></thead><tbody>${arts.map(a=>{const t=by.reduce((s,m)=>s+(m.get(a)||0),0);return `<tr><td>${esc(a)}</td>${by.map(m=>`<td>${m.has(a)?nf0.format(m.get(a)):'–'}</td>`).join('')}<td>${nf0.format(t)}</td><td>${nf.format(t/months)}</td></tr>`}).join('')}</tbody><tfoot><tr><td>Summe</td>${by.map(m=>`<td>${nf0.format([...m.values()].reduce((s,x)=>s+x,0))}</td>`).join('')}<td>${nf0.format(tot)}</td><td>${nf.format(tot/months)}</td></tr></tfoot></table></div></div>`;
  }
  if(unassigned)h+=`<div class="banner"><b>${unassigned} ältere Buchungen mit Zusatz „${esc(vt)}“ sind noch keinem Fahrzeug zugeordnet.</b><div class="small muted">Sie fehlen in dieser Übersicht. Im Scheckheft kannst du sie zuordnen.</div><div class="btns"><button class="btn sm" data-act="vTab" data-v="scheck">Zum Scheckheft</button></div></div>`;
  return h;
}

function closeModal(){$('#modal').classList.remove('open');$('#sheet').innerHTML='';if(S.pending){S.pending=false;refresh()}}
const btnRow=(del,extra)=>`<div class="btns"><button class="btn pri" type="submit" style="flex:1">Speichern</button><button class="btn" type="button" data-act="close">Abbrechen</button>${del?`<button class="btn dng" type="button" data-act="${del}" data-confirm="1">Löschen</button>`:''}${extra||''}</div>`;
function fld(id,label,val,attrs){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(val==null?'':val)}" ${attrs||''}></div>`}
function sel(id,label,opts,cur){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select></div>`}
function modalEntry(id,over){
  const e=Object.assign({},S.byId.get(id),over||{});if(!S.byId.get(id))return;
  openModal(`<h2>Buchung bearbeiten</h2><form data-form="entryEdit" data-id="${esc(id)}" style="display:flex;flex-direction:column;gap:12px">${entryFields('m',e)}${btnRow('entryDel')}</form>`);

function renameKonto(old,nw){
  const o=lc(old),keys=new Set();
  S.months.forEach((arr,key)=>{let ch=false;arr.forEach(e=>{if(lc(e.v)===o){e.v=nw;ch=true}if(lc(e.n)===o){e.n=nw;ch=true}});if(ch)keys.add(key)});
  const k=konten().find(x=>lc(x.n)===o);k.n=nw;
  CFG().regeln.forEach(r=>{if(lc(r.konto)===o)r.konto=nw;if(lc(r.n)===o)r.n=nw});
  try{if(lc(localStorage.getItem('hb-von'))===o)localStorage.setItem('hb-von',nw)}catch(x){}
  keys.forEach(saveMonth);rebuild();
}

/* ---------- PDF / CSV ---------- */
async function saveFile(name,data){
  if(!window.claude)return HBX.saveFile(name,data,toast);
  try{const d=await window.claude.use('downloads');if(!d){toast('Speichern ist in dieser Ansicht nicht verfügbar');return}await d.save({filename:name,data})}
  catch(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich: '+((e&&(e.code||e.message))||e))}
}
function pdf(title,sub,head,body,foot,name){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF-Baustein konnte nicht geladen werden');return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:head.length>7?'landscape':'portrait'});
  doc.setFontSize(16);doc.text(title,14,16);doc.setFontSize(9);doc.setTextColor(90);doc.text(sub,14,22);
  doc.autoTable({head:[head],body,foot:foot?[foot]:undefined,startY:27,styles:{fontSize:8,cellPadding:1.6},headStyles:{fillColor:[14,107,91]},footStyles:{fillColor:[230,238,235],textColor:20},margin:{left:14,right:14},didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('Erstellt am '+pd(today()),14,doc.internal.pageSize.getHeight()-8)}});
  saveFile(name,doc.output('arraybuffer'));
}
const pn=n=>nf.format(n);
function csv(rows){return '﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n')}
function pdfSteuer(){
  const y=String(S.sy),d=steuerData(y);const body=[];let sum=0;
  d.ent.forEach(e=>{body.push([pd(e.d),e.st,e.n+(e.t?' – '+e.t:''),e.bl||'',pn(e.b)]);sum+=e.b});
  d.kosten.forEach(k=>{body.push([pd(k.d),'manuell',k.t,k.m||'',pn(k.b)]);sum+=k.b});
  body.sort((a,b)=>a[0].split('.').reverse().join('')<b[0].split('.').reverse().join('')?-1:1);
  const km=d.fahrten.reduce((s,f)=>s+(+f.km||0),0);
  pdf('Steuerübersicht '+y,'Absetzbare Kosten · Fahrten '+nf0.format(km)+' km × '+pn(CFG().pausch)+' EUR = '+pn(km*CFG().pausch)+' EUR',['Datum','Kategorie','Beschreibung','Beleg','Betrag EUR'],body,['','','','Summe',pn(sum)],'Steuer-'+y+'.pdf');
}
function pdfFahrten(){
  const y=String(S.sy),d=steuerData(y);const km=d.fahrten.reduce((s,f)=>s+(+f.km||0),0);
  pdf('Fahrtenbuch '+y,d.fahrten.length+' Fahrten',['Datum','Ort','Anlass','Kilometer'],d.fahrten.map(f=>[pd(f.d),f.o,f.t||'',nf0.format(f.km)]),['','','Summe',nf0.format(km)+' km'],'Fahrtenbuch-'+y+'.pdf');
}
function pdfSprit(){
  const v=curVeh();if(!v)return;const rows=spritCalc(v.id).filter(r=>S.sv.year==='all'||r.d.startsWith(S.sv.year));
  const sp=rows.reduce((s,r)=>s+r.p,0),li=rows.reduce((s,r)=>s+r.liter,0);const wk=rows.filter(r=>r.dk),k=wk.reduce((s,r)=>s+r.dk,0),lw=wk.reduce((s,r)=>s+r.liter,0);
  pdf('Tankbuch '+v.n,(S.sv.year==='all'?'Alle Jahre':S.sv.year)+(k?' · Ø '+pn(lw/k*100)+' l/100 km':''),['Datum','EUR/l','Betrag EUR','Liter','km-Stand','gefahren km','l/100 km','EUR/km'],rows.map(r=>[pd(r.d),pn(r.ppl),pn(r.p),pn(r.liter),r.km!=null?nf0.format(r.km):'',r.dk?nf0.format(r.dk):'',r.l100?pn(r.l100):'',r.ekm?pn(r.ekm):'']),['Summe','',pn(sp),pn(li),'',nf0.format(k),'',''],'Tankbuch-'+v.n.replace(/[^\w]+/g,'_')+'.pdf');
}
function pdfSchein(){
  const v=curVeh();if(!v)return;const l=svEntries(v).filter(e=>S.sv.year==='all'||e.d.startsWith(S.sv.year));const sum=l.reduce((s,e)=>s+e.b,0);
  pdf('Scheckheft '+v.n,(S.sv.year==='all'?'Alle Jahre':S.sv.year)+' · '+l.length+' Einträge',['Datum','Art','Werkstatt / Empfänger','km-Stand','Info','Kosten EUR'],l.map(e=>[pd(e.d),e.ak||'Sonstiges',e.n,e.km?nf0.format(e.km):'',e.t||'',pn(e.b)]),['','','','','Summe',pn(sum)],'Scheckheft-'+v.n.replace(/[^\w]+/g,'_')+'.pdf');
}
function pdfAus(){
  const r=rangeOf(),t=totals(S.asc.filter(e=>e.d>=r.from&&e.d<=r.to));
  const rows=[...t.cats.entries()].sort((a,b)=>b[1].sum-a[1].sum).map(([c,o])=>[c,TYP_LABEL[o.typ],o.n,pn(o.sum)]);
  pdf('Auswertung '+r.label,'Einnahmen '+pn(t.ein)+' EUR · Ausgaben '+pn(t.aus)+' EUR · Übrig '+pn(t.ein-t.aus)+' EUR',['Kategorie','Art','Anzahl','Summe EUR'],rows,null,'Auswertung.pdf');
}
function pdfJahr(){
  const yr=yearRows().reverse();
  pdf('Jahresübersicht','Einnahmen, Ausgaben und Übrig pro Jahr',['Jahr','Einnahmen EUR','Ausgaben EUR','Übrig EUR'],yr.map(r=>[r.y,pn(r.t.ein),pn(r.t.aus),pn(r.t.ein-r.t.aus)]),null,'Jahresuebersicht.pdf');
}
function csvAll(){saveFile('Haushaltsbuch.csv',csv([['Datum','Von','Nach','Betrag','Info','Kategorie','Zusatz','Steuer','Beleg','Fahrzeug','Art','km'],...S.asc.map(e=>[pd(e.d),e.v,e.n,String(e.b).replace('.',','),e.t,e.k,(e.z||[]).join(', '),e.st||'',e.bl||'',((vehicles().find(x=>x.id===e.fz)||{}).n)||'',e.ak||'',e.km||''])]))}

function delSt(t,kind,formName){
  if(t.dataset.confirm==='1'){t.dataset.confirm='2';t.textContent='Wirklich löschen?';return}
  const id=$('[data-form='+formName+']').dataset.id;
  S.steuer.forEach((d,y)=>{if(d[kind].some(x=>x.i===id)){d[kind]=d[kind].filter(x=>x.i!==id);saveSteuer(y)}});
  closeModal();refresh();
}
function putSt(kind,obj,oldId){
  S.steuer.forEach((d,y)=>{if(d[kind].some(x=>x.i===oldId)){d[kind]=d[kind].filter(x=>x.i!==oldId);saveSteuer(y)}});
  const y=obj.d.slice(0,4);const d=stDoc(y);d[kind].push(obj);saveSteuer(y);
}

    FC.f.touched=false;FC.f.z=new Set();$('#f-zc').innerHTML=chipsZ('f');acHide();updPrev('f');
    toast('Gebucht: '+eur(e.b)+' → '+e.n,{label:'Rückgängig',fn:()=>undoEntry(e.i)});$('#f-amt').focus();
  },
  sf2:()=>{
    const e=readEntry('s');if(!e)return;const b=getDate('u');if(!b){toast('„Bis“-Datum nicht erkannt');return}
    const ds=serieDates(e.d,b,$('#s-iv').value);if(!ds.length){toast('Keine Termine im Zeitraum');return}
    if(ds.length>=400){toast('Zeitraum zu groß (max. 400 Termine)');return}
    const gid=uid('s'),ids=[],ts=Date.now();

  tf:()=>{
    const v=vehicles().find(x=>x.id===$('#t-fz').value),d=getDate('t'),p=parseNum($('#t-p').value),ppl=parseNum($('#t-ppl').value),km=parseNum($('#t-km').value),konto=$('#t-konto').value;

    toast('Getankt: '+eur(o.p)+' · '+nf.format(o.p/o.ppl)+' l',{label:'Rückgängig',fn:()=>undoEntry(e.i)});$('#t-p').focus();

  entryNew:()=>{const e=readEntry('m');if(!e)return;try{localStorage.setItem('hb-von',e.v)}catch(x){}addEntry(e);closeModal();toast('Gebucht: '+eur(e.b))},
  entryEdit:f=>{const e=readEntry('m',f.dataset.id);if(!e)return;updateEntry(e);closeModal();toast('Gespeichert')},
  ruleSave:f=>{
    const id=f.dataset.id,typ=f.dataset.typ,b=parseNum($('#r-b').value);if(isNaN(b)){toast('Bitte einen Betrag angeben');return}
    const old=id?CFG().regeln.find(r=>r.id===id):null;
    const r={id:id||uid('r'),typ,n:$('#r-n').value.trim(),b,iv:+$('#r-iv').value,start:$('#r-start').value,t:$('#r-t').value.trim(),konto:$('#r-konto').value,k:$('#r-k').value,z:$('#r-z').value?[$('#r-z').value]:[],auto:$('#r-auto').value==='1',a:$('#r-act').checked,last:old?old.last:null};
    if($('#r-st').value)r.st=$('#r-st').value;
    if(!old){const d=dues({...r,last:null},today());r.last=d.length?d[d.length-1]:addM(r.start,-r.iv,+r.start.slice(8,10));
      // neue Regel: vergangene Fälligkeiten werden nicht nachgebucht, ab heute läuft sie automatisch
      CFG().regeln.push(r)}else CFG().regeln[CFG().regeln.indexOf(old)]=r;

  abgleich:f=>{
    const n=f.dataset.n,ist=parseNum($('#ab-ist').value);if(isNaN(ist)){toast('Bitte den Kontostand eintragen');return}
    const soll=balances()[lc(n)];const e=ausgleichEntry(n,ist,soll,$('#ab-d').value||today());
    if(!e){toast('Stimmt bereits überein');closeModal();return}
    addEntry(e);closeModal();toast('Ausgleich gebucht: '+sgn(e.v==='Ausgleich'?e.b:-e.b,true));
  },
  kontoSave:f=>{const k=konten().find(x=>x.n===f.dataset.n);
    const nn=$('#ko-name').value.trim();
    if(nn&&nn!==k.n){
      if(lc(nn)!==lc(k.n)&&(isKonto(nn)||(S.names||[]).some(x=>lc(x)===lc(nn)))){toast('Der Name „'+nn+'“ wird schon für ein Konto oder einen Empfänger/eine Quelle benutzt. Bitte einen anderen wählen.');return}
      const cnt=S.asc.filter(e=>lc(e.v)===lc(k.n)||lc(e.n)===lc(k.n)).length;
      if(f.dataset.ren!==nn){f.dataset.ren=nn;$('#ko-warn').innerHTML='<b>„'+esc(k.n)+'“ → „'+esc(nn)+'“:</b> '+cnt+' Buchungen werden angepasst. Zum Bestätigen noch einmal auf Speichern tippen.';return}
      renameKonto(k.n,nn);
    }
    k.g=$('#ko-g').value.trim();const s=parseNum($('#ko-s').value);if(!isNaN(s))k.start=s;saveCfg();closeModal();refresh()},
  kontoNew:()=>{
    const n=$('#ko-n').value.trim();if(!n)return;if(isKonto(n)){toast('Dieses Konto gibt es schon');return}
    const s=parseNum($('#ko-s').value)||0;konten().push({n,start:0,g:$('#ko-g').value.trim()||'Sonstige',a:true});saveCfg();
    if(s){const e=ausgleichEntry(n,s,0,today());e.t='Startsaldo';addEntry(e)}
    closeModal();refresh();
  },
  fahrtSave:f=>{const km=parseNum($('#fa-km').value);if(isNaN(km)){toast('Bitte Kilometer angeben');return}putSt('fahrten',{i:f.dataset.id||uid('f'),d:$('#fa-d').value,km,o:$('#fa-o').value.trim(),t:$('#fa-t').value.trim()},f.dataset.id);S.sy=+$('#fa-d').value.slice(0,4);closeModal();refresh()},
  kosSave:f=>{const b=parseNum($('#ks-b').value);if(isNaN(b)){toast('Bitte Betrag angeben');return}putSt('kosten',{i:f.dataset.id||uid('k'),d:$('#ks-d').value,b,t:$('#ks-t').value.trim(),m:$('#ks-m').value.trim()},f.dataset.id);S.sy=+$('#ks-d').value.slice(0,4);closeModal();refresh()},
  fillSave:f=>{
    const v=curVeh(),ppl=parseNum($('#sf-ppl').value),p=parseNum($('#sf-p').value),km=parseNum($('#sf-km').value);
    if(isNaN(ppl)||isNaN(p)||ppl<=0){toast('Bitte Literpreis und Betrag angeben');return}
    const o={d:$('#sf-d').value,ppl:Math.round(ppl*1000)/1000,p:Math.round(p*100)/100,km:isNaN(km)?null:Math.round(km)};
    const old=f.dataset.d;let l=(S.sprit.get(v.id)||[]).filter(x=>x.d!==old);l.push(o);S.sprit.set(v.id,l);saveSprit(v.id);
    if(!old&&$('#sf-buch')&&$('#sf-buch').checked){const z=['Auto','Fahrtkosten'].filter(x=>CFG().zusatz.some(y=>y.n===x));addEntry({i:uid('e'),d:o.d,v:$('#sf-konto').value,n:'Tankstelle',b:o.p,t:'Tanken '+v.n,k:'Andere',z,fz:v.id,ak:'Sprit',ts:Date.now()})}
    closeModal();refresh();
  },
  vehNew:()=>{const n=$('#ve-n').value.trim();if(!n)return;const v={id:uid('v'),n,typ:$('#ve-typ').value,tank:parseNum($('#ve-t').value)||0,a:true};vehicles().push(v);S.sv.id=v.id;saveCfg();closeModal();refresh()},
  catAdd:f=>{const l=f.dataset.l,n=f.elements.n.value.trim();if(!n)return;if(CFG()[l].some(x=>lc(x.n)===lc(n))){toast('Gibt es schon');return}const o={n,a:true};if(l==='kats')o.typ=f.elements.typ.value;CFG()[l].push(o);saveCfg();refresh()},
  pausch:()=>{const v=parseNum($('#pa').value);if(!isNaN(v)){CFG().pausch=v;saveCfg();toast('Gespeichert')}}
};

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(ev.target.id==='modal'){closeModal();return}
  if(t&&A[t.dataset.act]){if(t.tagName==='TR'||t.tagName==='BUTTON'||t.tagName==='DIV'||true)A[t.dataset.act](t,ev)}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;const id=(f.id==='ef'||f.id==='tf'||f.id==='sf2')?f.id:f.dataset.form;if(FORMS[id])FORMS[id](f);
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='f-nach'||t.id==='m-nach')fillFromKnown(t.dataset.p);
  if(t.id==='f-von'||t.id==='m-von'){const p=t.id[0];if(isKonto($('#'+p+'-nach').value))fillFromKnown(p)}
  if(t.classList&&t.classList.contains('dt')){const p=t.id.split('-')[0];if(!getDate(p)){toast('Datum nicht erkannt (z. B. 5.3. oder +1)');setDate(p,t.dataset.iso||today())}updPrev(p)}
  if(t.id==='s-iv'||(t.classList&&t.classList.contains('dt')&&(t.id==='s-date'||t.id==='u-date')))setTimeout(serPrev,0);
  if(t.id==='t-fz'){const l=Math.max(0,...(S.sprit.get(t.value)||[]).map(x=>x.km||0));$('#t-km').placeholder=l?String(l):''}
  if(t.id==='sy'){S.sy=+t.value;render()}
  if(t.id==='sv-v'){S.sv.id=t.value;render()}
  if(t.id==='sv-y'){S.sv.year=t.value;render()}
  if(S.view==='buchungen'){const m={'b-konto':'konto','b-cat':'cat','b-from':'from','b-to':'to'}[t.id];if(m){S.bf[m]=t.value;S.bf.lim=150;fillBuchungen()}if(t.id==='b-st'){S.bf.st=t.checked;fillBuchungen()}}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.ac){acShow(t)}
  if(/^[fms]-(date|amt|von|nach)$/.test(t.id))updPrev(t.id[0]);if(/^[su]-(date|amt)$/.test(t.id))serPrev();
  if(t.id==='t-p'||t.id==='t-ppl')tankPrev();
  if(t.id==='b-q'){S.bf.q=t.value;S.bf.lim=150;fillBuchungen()}
  if(t.id==='ab-ist'){const k=$('[data-form=abgleich]');if(!k)return;const ist=parseNum(t.value),soll=balances()[lc(k.dataset.n)];$('#ab-diff').textContent=isNaN(ist)?'':'Differenz: '+sgn(ist-soll,true)}
});
document.addEventListener('keydown',ev=>{if(ev.defaultPrevented)return;if(ev.key==='Escape'&&!acOpen()){closeModal();return}eKey(ev)},true);
document.addEventListener('mousedown',ev=>{const a=ev.target.closest&&ev.target.closest('.aci');if(a){ev.preventDefault();acPick(a.dataset.v)}});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('dt')&&t.select)setTimeout(()=>t.select(),0);if(t.dataset&&t.dataset.ac)acShow(t)});
document.addEventListener('focusout',ev=>{const i=ev.target;if(i.dataset&&i.dataset.ac)setTimeout(()=>{if(document.activeElement===i)return;const b=i.parentNode.querySelector('.ac');if(b)b.hidden=true;if(AC.inp===i){AC.idx=-1;AC.items=[]}},120)});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pending&&!$('#modal.open')&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))){refresh()}},150)});
window.addEventListener('hashchange',route);

/* ---------- Start: Datenbank verbinden ---------- */
function setSync(ok,txt){const s=$('#sync');s.className='sync'+(ok?'':' wait');s.querySelector('span').textContent=txt}
function maybeBoot(){
  if(!S.got.c||!S.got.m)return;
  if(!S.booted){S.booted=true;rebuild();updateHeader();updateLists();route()}
  if(S.fresh.c&&S.fresh.m&&!S.auto){S.auto=true;autoBook()}
  if(S.fresh.c&&S.fresh.m&&!window.GH_MODE)setSync(true,'synchron')
}
async function start(){
  renderTabs();
  if(window.claude){try{db=await window.claude.use('db')}catch(e){db=null}}
  else{const c=HBX.ghLoad();if(!c){renderSetup();return}window.GH_MODE=true;window.GH_CFG=c;db=HBX.ghMake(c,onGhStatus)}
  if(!db){$('#main').innerHTML='<div class="empty">Die Datenbank ist hier nicht verfügbar. Öffne die Seite über deinen claude.ai-Link, angemeldet mit deinem Konto.</div>';$('#hsum').textContent='';setSync(false,'offline');return}
  const timer=setTimeout(()=>{if(!(S.fresh.c&&S.fresh.m)){setSync(false,'Daten evtl. nicht aktuell');if(!S.booted){S.got.c=S.got.m=true;maybeBoot()}}},10000);
  const err=e=>{setSync(false,'Fehler: '+(e&&e.code||'unbekannt'))};
  db.doc('config/main').onSnapshot(s=>{
    if(!dirty.c){S.cfg=s.exists?s.data():null;if(S.cfg)S.cfg=clone(S.cfg);const c=CFG();for(const k of['kats','zusatz','steuerKats','konten','fahrzeuge','regeln']){if(!c[k])c[k]=defCfg()[k]}if(c.pausch==null)c.pausch=0.30;if(!c.stichtag)c.stichtag=today()}
    S.got.c=true;if(!s.metadata.fromCache)S.fresh.c=true;
    if(S.booted){rebuild();refresh()}maybeBoot();
  },err);
  db.collection('monate').onSnapshot(s=>{
    s.docChanges().forEach(ch=>{const id=ch.doc.id;if(dirty.m.has(id))return;if(ch.type==='removed')S.months.delete(id);else S.months.set(id,clone(ch.doc.data().e||[]))});
    S.got.m=true;if(!s.metadata.fromCache)S.fresh.m=true;
    if(S.booted){rebuild();refresh()}maybeBoot();
  },err);
  db.collection('sprit').onSnapshot(s=>{
    s.docChanges().forEach(ch=>{const id=ch.doc.id;if(dirty.s.has(id))return;if(ch.type==='removed')S.sprit.delete(id);else S.sprit.set(id,clone(ch.doc.data().f||[]))});
    if(S.booted)refresh();
  },err);
  db.collection('steuer').onSnapshot(s=>{
    s.docChanges().forEach(ch=>{const id=ch.doc.id;if(dirty.t.has(id))return;if(ch.type==='removed')S.steuer.delete(id);else{const d=clone(ch.doc.data());S.steuer.set(id,{fahrten:d.fahrten||[],kosten:d.kosten||[]})}});
    if(S.booted)refresh();
  },err);
  if(window.GH_MODE)db.startSync();
}

/* ===== Zusatz für die eigenständige App ===== */
function onGhStatus(s){setSync(s.state==='ok'||s.state==='busy',s.msg||'');window.GH_STATE=s;const e=$('#ghstate');if(e)e.textContent=s.msg||''}
function ghCard(){
  if(!window.GH_MODE)return '';const c=window.GH_CFG;
  return `<div class="card"><h3>Verbindung</h3><div class="small muted">Deine Daten liegen auf diesem Gerät und im privaten Repository <b>${esc(c.owner)}/${esc(c.repo)}</b>.</div><div class="small" id="ghstate">${esc((window.GH_STATE||{}).msg||'')}</div><div class="btns"><button class="btn" data-act="ghSync">Jetzt synchronisieren</button><button class="btn" data-act="ghCode">Kopplungscode für ein anderes Gerät</button><button class="btn dng" data-act="ghOut" data-confirm="1">Trennen</button></div></div>`;
}
A.ghSync=()=>{db.sync();toast('Synchronisiere …')};
A.ghCode=()=>{openModal(`<h2>Kopplungscode</h2><div class="small muted">Enthält deinen Zugangs-Token. Schick ihn nur dir selbst (z. B. als Notiz oder Nachricht an dich) und lösche ihn danach. Auf dem anderen Gerät beim ersten Start einfügen.</div><textarea id="gc" rows="5" readonly style="font:12px monospace">${esc(HBX.makeCode(window.GH_CFG))}</textarea><div class="btns"><button class="btn pri" data-act="ghCopy">Kopieren</button><button class="btn" data-act="close">Schließen</button></div>`)};
A.ghCopy=async()=>{const t=$('#gc');t.select();try{await navigator.clipboard.writeText(t.value);toast('Kopiert')}catch(e){toast('Markiert, bitte von Hand kopieren')}};
A.ghOut=t=>{if(t.dataset.confirm==='1'){t.dataset.confirm='2';const n=db.pending();t.textContent=n?'Achtung: '+n+' Änderungen noch nicht hochgeladen. Trotzdem trennen?':'Wirklich trennen? Lokale Kopie wird gelöscht';return}HBX.ghClear();location.reload()};
function renderSetup(){
  setSync(false,'nicht verbunden');$('#hsum').textContent='';$('#tabs').innerHTML='';
  $('#main').innerHTML=`<div class="card"><h2>Mit dem Daten-Repository verbinden</h2><div class="small muted">Einmalig pro Gerät. Deine Daten liegen in einem privaten GitHub-Repository, so sind Handy und PC synchron.</div>
  <form data-form="ghCode" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="gh-code">Kopplungscode (wenn schon ein Gerät verbunden ist)</label><textarea id="gh-code" rows="3" placeholder="HB1.…"></textarea></div><button class="btn pri" type="submit">Mit Code verbinden</button></form></div>
  <form class="card" data-form="ghManual"><h3>Oder von Hand</h3><div class="field"><label for="gh-o">GitHub-Benutzername</label><input id="gh-o" autocapitalize="none" autocomplete="off"></div><div class="field"><label for="gh-r">Name des Daten-Repositorys</label><input id="gh-r" value="haushaltsbuch-daten" autocapitalize="none" autocomplete="off"></div><div class="field"><label for="gh-t">Zugangs-Token</label><input id="gh-t" type="password" autocapitalize="none" autocomplete="off" placeholder="github_pat_…"></div><button class="btn pri" type="submit">Verbinden</button></form>
  <div id="gh-err" class="small neg"></div>`;
}
async function ghDo(c){const err=$('#gh-err');err.textContent='Verbinde …';try{await HBX.ghConnect(c);err.textContent='';await start()}catch(e){err.textContent=(e&&e.message)||String(e);if(String(e&&e.message).startsWith('Failed')||e instanceof TypeError)err.textContent='Keine Verbindung zu GitHub. Internet prüfen.'}}
FORMS.ghCode=()=>{try{ghDo(HBX.parseCode($('#gh-code').value))}catch(e){$('#gh-err').textContent=e.message}};
FORMS.ghManual=()=>{const o=$('#gh-o').value.trim(),r=$('#gh-r').value.trim(),t=$('#gh-t').value.trim();if(!o||!r||!t){$('#gh-err').textContent='Bitte alle drei Felder ausfüllen.';return}ghDo({owner:o,repo:r,token:t})};
if(window.HBX&&HBX.isNative()){try{const AP=Capacitor.registerPlugin('App');AP.addListener('backButton',()=>{if($('#modal.open'))closeModal();else if(S.view!=='eintragen')go('eintragen');else AP.exitApp()})}catch(e){}}
if('serviceWorker' in navigator&&window.HBX&&!HBX.isNative()&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
start();
</script>
